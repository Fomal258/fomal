  <script id="layer-styles">(function(){if(window.__layerStyles)return;window.__layerStyles=1;var css="/* unslop-pass */\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   unslop \uc815\ub9ac \ud328\uc2a4 \u2014 \ud06c\ub86c\uc740 \uc870\uc6a9\ud558\uac8c, \uc0c9\uc740 \uce74\ub4dc\uc758 \uc21c\uac04\uc5d0\ub9cc\n   \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n:root {\n  --ink: #0b0b0c;\n  --surface: #131315;\n  --raised: #1b1b1e;\n  --hairline: rgba(255, 255, 255, .10);\n  --text: #f2f2f3;\n  --text-2: #b6b6bb;\n  --muted: #8b8b92;\n  --step-1: 11px;\n  --step-2: 12.5px;\n  --step-3: 14px;\n  --step-4: 18px;\n}\n\n/* 1) \ud45c\uba74: \ud55c \ub7a8\ud504\ub85c \ud1b5\uc77c (\ub77c\uc774\ud2b8 \ud14c\ub9c8 \uc794\uc7ac \uc81c\uac70) */\nbody, .site-shell { background: var(--ink); }\n.site-header { background: var(--ink); }\n.roster-section { background: var(--ink); }\n.roster-toolbar { background: var(--ink); }\n\n/* 2) \ud0c0\uc785: 4\ub2e8\uacc4 + \ub450 \uc6e8\uc774\ud2b8, \uacfc\ud55c \ud2b8\ub798\ud0b9 \uc81c\uac70 */\n.hero-eyebrow, .overline, .brand-type small, .under-grid, .roster-note {\n  font-size: var(--step-1);\n  font-weight: 600;\n  letter-spacing: .08em;\n}\n.header-edit, .main-nav a, .sort-control select, .alpha-chip, .tab-active {\n  font-size: var(--step-2);\n  font-weight: 600;\n  letter-spacing: .01em;\n}\n.section-heading p { font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--text-2); }\n.hero h1 {\n  font-size: clamp(44px, 4.6vw, 68px);\n  font-weight: 800;\n  letter-spacing: -.02em;\n  text-shadow: 0 6px 24px rgba(0, 0, 0, .55);\n}\n.section-heading h2 { font-size: clamp(32px, 3vw, 44px); font-weight: 800; letter-spacing: -.02em; color: var(--text); }\n.hero h1 em, .section-heading h2 span { color: var(--brand-accent, #d61a30); }\n\n/* 3) \ud06c\ub86c\uc758 \uc0c9: \uc561\uc13c\ud2b8\ub294 \ud55c \ubc88, \ub098\uba38\uc9c0\ub294 \ub274\ud2b8\ub7f4 */\n.count {\n  background: transparent !important;\n  color: var(--text-2) !important;\n  border: 1px solid var(--hairline);\n  border-radius: 3px;\n  padding: 2px 6px !important;\n  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n  font-variant-numeric: tabular-nums;\n  font-size: var(--step-1);\n}\n.tab-active { color: var(--text); }\n.alpha-chip { border-radius: 3px; color: var(--text-2); }\n.alpha-chip:disabled { color: #5f5f66; opacity: 1; }\n.roster-toolbar .toolbar-left::after {\n  background: var(--hairline) !important;\n  height: 1px !important;\n}\n.roster-section::before {\n  background: var(--hairline) !important;\n  height: 1px !important;\n  opacity: 1 !important;\n}\n.under-grid, .under-grid p, .roster-note, .roster-note span {\n  color: var(--text-2) !important;\n  font-size: 12.5px;\n}\n.under-grid p { color: var(--muted) !important; }\n.roster-note .desktop-note { color: var(--muted) !important; }\n.alpha-chip.is-active {\n  color: #fff;\n  background: var(--brand-accent, #d61a30);\n  border-color: transparent;\n}\n.add-card {\n  background: var(--surface) !important;\n  border: 1px dashed var(--hairline);\n  border-radius: 4px;\n  color: var(--text-2) !important;\n}\n.add-card strong { color: var(--text); }\n.add-card small { color: var(--muted); }\n.under-grid { color: var(--muted); }\n.under-grid i { background-color: var(--brand-accent, #d61a30); }\n\n/* 4) \ud6a8\uacfc: \uae00\ub85c\uc6b0\u00b7\uc774\uc911 \uadf8\ub9bc\uc790 \uc815\ub9ac */\n.hero.hero-has-strips .hero-content,\n.hero.hero-has-strips h1,\n.hero-film-caption { text-shadow: none !important; }\n.hero h1 { text-shadow: 0 6px 24px rgba(0, 0, 0, .55) !important; }\n.hero::after { background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.72)) !important; }\n.card-shell:hover .card-image {\n  box-shadow: 0 0 0 1px var(--hairline), 0 10px 24px rgba(0, 0, 0, .28) !important;\n}\n.info-modal, .editor-modal, .design-modal, .site-hub-modal {\n  border-radius: 6px;\n  box-shadow: 0 18px 48px rgba(0, 0, 0, .45);\n}\n\n/* 5) \ub77c\uc6b4\ub4dc: 4px \uacc4\uc5f4\ub85c \ud1b5\uc77c (\uce69\ub9cc pill \uc720\uc9c0) */\n.header-edit, .card-edit, .favorite-button, .columns-control, .search-box,\n.editor-modal input, .gh-sync-modal input, .design-modal input,\n.search-suggestions, .link-pop { border-radius: 4px; }\n.card-image, .wrestler-card { border-radius: 4px; }\n\n/* 5b) \ube48 \uc0c1\ud0dc\uac00 \ud070 \ube48 \ub760\ub85c \ubcf4\uc774\uc9c0 \uc54a\uac8c */\n.roster-section { min-height: 0 !important; }\n.empty-state { padding: 56px 0; color: var(--text-2); }\n\n/* 6) \ubaa8\uc158: \ubaa9\uc801 \uc5c6\ub294 \ubc18\ubcf5 \ubaa8\uc158 \uc815\ub9ac */\n*, *::before, *::after { animation-duration: .28s; }\n\n\n.ctrl-hover-bg { display: none !important; }\n.header-controls .header-edit:hover,\n.header-controls .header-edit:focus-visible {\n  background: rgba(255, 255, 255, .08) !important;\n  border-color: rgba(255, 255, 255, .22) !important;\n  color: #fff !important;\n}\n\n/* \u2500\u2500 unslop \ubaa8\ubc14\uc77c \ud328\uc2a4 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n@media (max-width: 820px) {\n  /* \ud5e4\ub354 \uc555\ucd95 + \uc561\uc158 \uac00\ub85c \uc2a4\ud06c\ub864 */\n  .site-header { height: auto !important; }\n  .header-inner {\n    min-height: 56px;\n    padding: 8px 14px !important;\n    flex-wrap: wrap;\n    row-gap: 6px;\n  }\n  .header-inner > div:last-child {\n    width: 100%;\n    overflow-x: auto;\n    flex-wrap: nowrap;\n    scrollbar-width: none;\n  }\n  .header-inner > div:last-child::-webkit-scrollbar { display: none; }\n  .main-nav { display: none; }           /* \ud558\ub2e8 \ubc14\uac00 \ub300\uc2e0\ud568 */\n\n  /* \ud788\uc5b4\ub85c \ucd95\uc18c */\n  .hero { min-height: 120px !important; }\n  .hero-content { padding: 14px 0 !important; }\n  .hero h1 { font-size: 34px !important; }\n  .hero-film-caption { display: none; }\n  .hero-eyebrow { font-size: 10px; letter-spacing: .14em; }\n\n  /* \uc139\uc158\u00b7\ud234\ubc14 \ubc00\ub3c4 */\n  .roster-section { padding: 18px 0 40px !important; }\n  .section-heading { margin-bottom: 10px !important; }\n  .section-heading h2 { font-size: 24px !important; }\n  .section-heading p { display: none; }\n  .roster-toolbar { min-height: 0 !important; gap: 8px !important; padding-bottom: 6px !important; }\n  .toolbar-left { min-height: 40px !important; width: 100%; }\n  .toolbar-right { padding-top: 6px !important; gap: 8px; }\n\n  /* \uc54c\ud30c\ubcb3: \ud55c \uc904 \uac00\ub85c \uc2a4\ud06c\ub864 */\n  .alpha-filter {\n    flex-wrap: nowrap !important;\n    overflow-x: auto;\n    -webkit-overflow-scrolling: touch;\n    gap: 6px !important;\n    padding-bottom: 4px;\n    scrollbar-width: none;\n  }\n  .alpha-filter::-webkit-scrollbar { display: none; }\n  .alpha-label { display: none; }\n  .alpha-chip { flex: 0 0 auto; min-width: 48px; height: 48px; font-size: 13px; }\n\n  /* \uba85\ud310 \ud06c\uae30 (\ubaa8\ubc14\uc77c 19px \u2192 13.5px, zoom 0.95 \ubc18\uc601) */\n  .tc-shell .tc-name-text { font-size: 13.5px !important; letter-spacing: .04em; }\n  .tc-shell .tc-name-text.is-long { font-size: 12.5px !important; }\n  .tc-shell .tc-name-text.is-xlong { font-size: 11.5px !important; }\n  .card-caption { padding: 6px 8px !important; }\n\n  /* \ud31d\uc5c5 \u2192 \ud558\ub2e8 \uc2dc\ud2b8 */\n  .editor-modal, .design-modal, .site-hub-modal, .gh-sync-modal {\n    position: fixed !important;\n    left: 0 !important; right: 0 !important; bottom: 0 !important; top: auto !important;\n    width: 100% !important; max-width: 100% !important;\n    max-height: 92vh;\n    overflow-y: auto;\n    margin: 0 !important;\n    border-radius: 12px 12px 0 0 !important;\n  }\n  .info-modal { max-height: 92vh; overflow-y: auto; }\n\n  /* \ud31d\uc5c5 \ub2eb\uae30 \ubc84\ud2bc\ub3c4 44px \ud655\ubcf4 */\n  /* zoom 0.95 \ubcf4\uc815: 48px \u2192 \uc2e4\ud6a8 45.6px */\n  .info-modal .info-header button,\n  .editor-modal .editor-header button,\n  .design-modal .design-header button,\n  .site-hub-modal .site-hub-header button,\n  .gh-sync-modal .editor-header button {\n    min-width: 48px;\n    min-height: 48px;\n  }\n}\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation: none !important; transition: none !important; }\n}\n\n/* polish-pass */\n\n/* \u2500\u2500 \ud3f4\ub9ac\uc2dc: \ub2f9\uc2e0 \ub514\uc790\uc778 \uc720\uc9c0, \uac78\ub9b0 \uac83\ub9cc \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n/* 1) \uba85\ud310 \ub192\uc774\u00b7\uc790\uac04 \ud1b5\uc77c \u2192 \uc774\ub984 \uae38\uc774\uc640 \ubb34\uad00\ud558\uac8c \uce74\ub4dc \uadf8\ub9ac\ub4dc\uac00 \ubc18\ub4ef\ud574\uc9d0 */\n.card-caption.tc-nameplate {\n  height: 44px !important;\n  display: flex !important;\n  align-items: center;\n  gap: 6px;\n}\n.tc-name-text {\n  letter-spacing: .04em !important;\n  line-height: 1.15 !important;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  min-width: 0;\n  max-width: 100%;\n}\n.card-caption .card-arrow { flex: 0 0 auto; }\n\n/* 2) \uc0ac\uc9c4 \uc5c6\uc74c\u00b7\ub85c\ub529 \uc911 \uc790\ub9ac\ud45c\uc2dc\uc790 (\ud770 \ubc88\uca4d\uc784 \uc81c\uac70, \ube0c\ub79c\ub4dc \ud1a4 \uc720\uc9c0) */\n.card-image { background: #17171a !important; }\n.card-image img { background: #17171a; }\n.silhouette-poster {\n  background:\n    radial-gradient(120% 100% at 50% 0%, #1f1f23 0%, #151517 58%, #101012 100%) !important;\n}\n.silhouette-watermark { color: rgba(255, 255, 255, .07) !important; }\n\n/* 3) \ud0a4\ubcf4\ub4dc \ud3ec\ucee4\uc2a4: \ube0c\ub79c\ub4dc \ub808\ub4dc \ub9c1 \ud558\ub098\ub85c \ud1b5\uc77c */\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\n[tabindex]:focus-visible {\n  outline: 3px solid var(--brand-accent, #d61a30) !important;\n  outline-offset: 2px;\n  border-radius: 4px;\n}\n\n/* 5) \ubaa8\ubc14\uc77c \uce74\ub4dc \uc544\uc774\ucf58: \ubcf4\uc774\ub294 \ud06c\uae30\ub294 \uadf8\ub300\ub85c, \ub204\ub974\ub294 \uc601\uc5ed\ub9cc 44px \uc774\uc0c1 */\n.card-edit::after,\n.favorite-button::after {\n  content: \"\";\n  position: absolute;\n  inset: -9px;\n  border-radius: 50%;\n}\n\n/* 4) \ubaa8\ubc14\uc77c \uccab \ud654\uba74 \ubc00\ub3c4: \ud788\uc5b4\ub85c 160\u2192132, \uccab \uce74\ub4dc \uc704\ub85c */\n@media (max-width: 820px) {\n  .hero { min-height: 132px !important; }\n  .hero-content { padding: 10px 0 !important; }\n  .hero h1 { font-size: 32px !important; }\n  .roster-section { padding-top: 14px !important; }\n  .section-heading { margin-bottom: 8px !important; }\n  .card-caption.tc-nameplate { height: 40px !important; }\n}\n\n/* mobile-ux */\n\n/* \u2500\u2500 \ubaa8\ubc14\uc77c \uc0ac\uc6a9\uc131 \uac1c\uc120 (\ud130\uce58 \ud0c0\uae43 \u00b7 \ud558\ub2e8 \ub0b4\ube44 \u00b7 \uce74\ub4dc \ubc00\ub3c4) \u2500\u2500 */\n@media (max-width: 820px) {\n  body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }\n\n  /* \ud130\uce58 \ud0c0\uae43: \ucd5c\uc18c 44px */\n  /* .site-shell \uc774 zoom:0.95 \ub85c \ucd95\uc18c\ub418\ubbc0\ub85c 48px\ub85c \uc7a1\uc544 \uc2e4\uc81c 45~46px \ud655\ubcf4 */\n  .header-edit, .hea       if (act === "sync") {
        window.scrollTo({ top: 0, behavior: "smooth" });

  window.__photoFallback = true;

  var EXTS = ["jpg", "jpeg", "webp", "png"];
  var cache = {};

  function slug(name) {
    return name.trim().toLowerCase().replace(/[.']/g, "").replace(/[^a-z0-9가-힣]+/g, "-").replace(/^-|-$/g, "");
  }

  // 후보를 2개로 제한: 정확한 이름 → 슬러그 (404 요청 최소화)
  function candidates(name) {
    var bases = [name.trim(), slug(name)];
    var out = [];
    bases.forEach(function (b) {
      if (!b) return;
