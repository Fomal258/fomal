   ──────────────────────────────────────────────────────────── */
.tc-shell .favorite-button,
.tc-shell:hover .favorite-button,
.tc-shell.is-champ .favorite-button.is-favorite,
.tc-shell .favorite-button:hover,
.tc-shell .favorite-button.is-favorite {

  right: auto !important;
  top: 11px !important;
  width: 38px !important;
  height: 38px !important;
  padding: 0 !important;
  border-radius: 50% !important;
  display: grid !important;
  place-items: center !important;
  z-index: 10 !important;
  overflow: visible !important;
  transition:
    opacity .24s ease,
    transform .26s cubic-bezier(.18, .89, .32, 1.28),

    border-color .24s ease,
    box-shadow .24s ease,
    color .24s ease !important;

/* 기존 별 핀 아래 세로 꼬리선 제거 */
.tc-shell .favorite-button::after {
  display: none !important;
}

/* 미선택(일반) 상태: 카드에 마우스를 올리면 다크·골드 메달리온 슬롯이 선명하게 표시됨 */
.tc-shell .favorite-button:not(.is-favorite) {
  opacity: 0 !important;
  background: radial-gradient(circle at 35% 30%, rgba(34, 31, 24, .92), rgba(10, 10, 14, .95)) !important;
  border: 1.5px solid rgba(240, 220, 176, .48) !important;
  color: rgba(240, 220, 176, .82) !important;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .65) !important;
  transform: scale(.92);
}
.tc-shell:hover .favorite-button:not(.is-favorite),
.tc-shell .favorite-button:not(.is-favorite):focus-visible {
  opacity: 1 !important;
  transform: scale(1);
}
.tc-shell .favorite-button:not(.is-favorite):hover {
  transform: scale(1.1) !important;
  border-color: #ffe8a3 !important;
  color: #ffe8a3 !important;
  background: radial-gradient(circle at 35% 30%, rgba(56, 44, 18, .96), rgba(16, 14, 10, .98)) !important;
  box-shadow:
    0 6px 16px rgba(0, 0, 0, .8),
    0 0 14px rgba(245, 208, 105, .45) !important;
}

/* 찜(챔피언) 선택 상태: 항상 선명하게 빛나는 3D 골드 메달리온 + 챔피언 벨트 */
.tc-shell .favorite-button.is-favorite,
.tc-shell:hover .favorite-button.is-favorite,
.tc-shell.is-champ .favorite-button.is-favorite {
  opacity: 1 !important;
  background:
    radial-gradient(circle at 30% 25%, #3d2e0e 0%, #17130a 65%, #0c0a06 100%) !important;
  border: 2px solid #f5d069 !important;
  color: #f8de8c !important;
  box-shadow:
    0 6px 16px rgba(0, 0, 0, .85),
    0 0 0 2px rgba(18, 14, 6, .9),
    0 0 0 3px rgba(245, 208, 105, .45),
    0 0 18px rgba(245, 208, 105, .55) !important;
  transform: scale(1);
}
.tc-shell .favorite-button.is-favorite:hover,
.tc-shell.is-champ .favorite-button.is-favorite:hover {
  transform: scale(1.12) !important;
  border-color: #fff3c4 !important;
  color: #fff3c4 !important;
  box-shadow:
    0 8px 20px rgba(0, 0, 0, .9),
    0 0 0 2px rgba(18, 14, 6, .95),
    0 0 0 3.5px rgba(255, 240, 179, .7),
    0 0 24px rgba(250, 204, 21, .75) !important;
}

/* 메달리온 내부 챔피언 벨트 SVG 크기 및 입체 그림자 */
.tc-shell .favorite-button svg.champ-belt-svg {
  width: 26px !important;
  height: 18px !important;
  display: block !important;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .9)) !important;
  transition: transform .24s ease, filter .24s ease !important;
}
.tc-shell .favorite-button.is-favorite svg.champ-belt-svg {
  width: 27px !important;
  height: 19px !important;
  filter:
    drop-shadow(0 2px 3px rgba(0, 0, 0, .95))
    drop-shadow(0 0 6px rgba(245, 208, 105, .55)) !important;
}

/* 찜한 선수 카드의 안쪽 금박 프레임(inset: 8px) 및 하단 이름 위 구분선도 챔피언십 골드로 연동 강조 */
.tc-shell.is-champ .tc-frame::after {
  border-width: 1.5px !important;
  background:
    linear-gradient(#0b0b0b, #0b0b0b) padding-box,
    linear-gradient(135deg, #b88928, #fde68a 30%, #fffbeb 50%, #eab308 70%, #9a6f18) border-box !important;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, .5),
    0 0 18px rgba(245, 208, 105, .38),
    inset 0 0 14px rgba(245, 208, 105, .18) !important;
}
.tc-shell.is-champ .card-caption.tc-nameplate:before {
  height: 1.5px !important;
  background: linear-gradient(90deg, #f5d069 0%, #fff6d1 50%, rgba(245, 208, 105, .25) 100%) !important;
  box-shadow: 0 0 8px rgba(245, 208, 105, .45);
}


/* ────────────────────────────────────────────────────────────
   31. 챔피언 벨트 원형 테두리 제거 & 크기 확대 · 우상단 펜 수정 버튼 분리 · 이름 위 라인 제거 & 고급 폰트 확대
   ──────────────────────────────────────────────────────────── */

/* ① 챔피언십 벨트 아이콘: 바깥 원형 테두리·배경 완전 제거 + 벨트 자체 크기 대폭 확대 */
.tc-shell .favorite-button,
.tc-shell:hover .favorite-button,
.tc-shell.is-champ .favorite-button.is-favorite,
.tc-shell .favorite-button:hover,
.tc-shell .favorite-button.is-favorite {
  left: 11px !important;
  right: auto !important;
  top: 10px !important;
  width: 42px !important;
  height: 30px !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  display: grid !important;
  place-items: center !important;
  z-index: 12 !important;
}
.tc-shell .favorite-button:not(.is-favorite) {
  opacity: 0 !important;
  color: rgba(245, 226, 184, .82) !important;
  transform: scale(.94);
}
.tc-shell:hover .favorite-button:not(.is-favorite),
.tc-shell .favorite-button:not(.is-favorite):focus-visible {
  opacity: 1 !important;
  transform: scale(1);
}
.tc-shell .favorite-button:not(.is-favorite):hover {
  color: #ffe8a3 !important;
  transform: scale(1.14) !important;
}
.tc-shell .favorite-button.is-favorite,
.tc-shell:hover .favorite-button.is-favorite,
.tc-shell.is-champ .favorite-button.is-favorite {
  opacity: 1 !important;
  color: #f7d774 !important;
  transform: scale(1);
}
.tc-shell .favorite-button.is-favorite:hover,
.tc-shell.is-champ .favorite-button.is-favorite:hover {
  color: #fff3c4 !important;
  transform: scale(1.15) !important;
}
.tc-shell .favorite-button svg.champ-belt-svg {
  width: 38px !important;
  height: 26px !important;
  display: block !important;
  filter:
    drop-shadow(0 2px 4px rgba(0, 0, 0, .95))
    drop-shadow(0 0 2px rgba(0, 0, 0, .85)) !important;
  transition: transform .22s ease, filter .22s ease !important;
}
.tc-shell .favorite-button.is-favorite svg.champ-belt-svg {
  width: 40px !important;
  height: 27px !important;
  filter:
    drop-shadow(0 2px 5px rgba(0, 0, 0, .95))
    drop-shadow(0 0 9px rgba(247, 215, 116, .65)) !important;
}

/* ② 우측 상단 펜(프로필 수정) 버튼: 링크 이동과 완전히 분리되어 클릭 시 즉시 프로필 수정 팝업 오픈 */
.tc-shell > .card-edit {
  position: absolute !important;
  top: 10px !important;
  right: 10px !important;
  left: auto !important;
  z-index: 12 !important;
  width: 30px !important;
  height: 30px !important;
  padding: 0 !important;
  border: 1px solid rgba(240, 220, 176, .35) !important;
  border-radius: 4px !important;
  background: rgba(10, 10, 14, .78) !important;
  backdrop-filter: blur(4px);
  color: #f4e8c8 !important;
  display: grid !important;
  place-items: center !important;
  opacity: 0 !important;
  cursor: pointer !important;
  transition: opacity .2s ease, transform .2s ease, background .2s ease, border-color .2s ease, color .2s ease !important;
}
.tc-shell:hover > .card-edit,
.tc-shell:focus-within > .card-edit,
.tc-shell > .card-edit:focus-visible,
.wrestler-card.editing ~ .card-edit {
  opacity: 1 !important;
}
.tc-shell > .card-edit:hover:not(:disabled) {
  background: #d61a30 !important;
  border-color: #ff6b7b !important;
  color: #fff !important;
  transform: scale(1.08);
}

/* ③ 선수 이름 위 가로 라인 완전 제거 + 고급스러운 대형 디스플레이 세리프/컨덴스드 폰트 적용 */
.tc-shell .card-caption.tc-nameplate:before,
.tc-shell.is-champ .card-caption.tc-nameplate:before,
.tc-shell .card-caption.tc-nameplate:after {
  display: none !important;
  content: none !important;
}
.tc-shell .card-caption.tc-nameplate {
  left: 13px !important;
  right: 13px !important;
  bottom: 12px !important;
  padding: 0 !important;
}
.tc-shell .tc-name-text {
  font-family: "Cinzel", "Bebas Neue", "Oswald", "Noto Sans KR", serif !important;
  font-weight: 800 !important;
  font-size: clamp(16px, 1.38vw, 24px) !important;
  line-height: 1.04 !important;
  letter-spacing: .04em !important;
  text-transform: uppercase !important;
  color: #f8f3e6 !important;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, .95),
    0 4px 18px rgba(0, 0, 0, .88),
    0 0 12px rgba(232, 205, 146, .22) !important;
  max-height: 2.15em !important;
  transition: color .24s ease, transform .24s ease, text-shadow .24s ease !important;
}
.tc-shell:hover .tc-name-text {
  color: #fff8e1 !important;
  transform: translateY(-1.5px) !important;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, .98),
    0 6px 20px rgba(0, 0, 0, .9),
    0 0 16px rgba(245, 208, 105, .45) !important;
}
.tc-shell.is-champ .tc-name-text {
  color: #fde68a !important;
  text-shadow:
    0 2px 4px rgba(0, 0, 0, .98),
    0 4px 16px rgba(0, 0, 0, .9),
    0 0 16px rgba(250, 204, 21, .45) !important;
}
@media (max-width: 640px) {
  .tc-shell .tc-name-text {
    font-size: 14px !important;
  }
  .tc-shell > .card-edit {
    opacity: .92 !important;
  }
}


/* ────────────────────────────────────────────────────────────
   32. 실버 크롬(평소) & 24K 럭셔리 골드 크롬(찜) 테두리 · 고휘도 초고해상도 메탈릭 대형 이름 · 금장 벨트
   ──────────────────────────────────────────────────────────── */

/* ① 모든 프로필 카드: 마우스 호버 시 정자세로 부드럽게 살짝 커지는(Scale Up) 효과 */
.tc-shell {
  transition: transform .28s cubic-bezier(.16, 1, .3, 1), z-index 0s !important;
  transform: scale(1) translateY(0) !important;
}
.tc-shell:hover {
  z-index: 6 !important;
  transform: scale(1.038) translateY(-4px) !important;
}
.tc-shell .card-image img {
  transition: transform .36s cubic-bezier(.16, 1, .3, 1), filter .28s ease !important;
}
.tc-shell:hover .card-image img {
  transform: scale(1.05) !important;
  filter: brightness(1.03) !important;
}

/* 이미지 위를 덮던 불필요한 레이어 완전 비활성화 */
.tc-shell .tc-holo-glare,
.tc-shell.is-champ .tc-holo-glare,
.tc-shell:hover .tc-holo-glare,
.tc-shell .card-image::before,
.tc-shell.is-champ .card-image::before,
.tc-shell .tc-frame::after {
  display: none !important;
  content: none !important;
  opacity: 0 !important;
}

/* ② 평소(일반) 프로필 테두리: 고급스러운 플래티넘 실버 크롬(Silver Chrome) 다이컷 베젤 (마우스 추적 빛 없음) */
.tc-shell .tc-frame,
.tc-shell:hover .tc-frame {
  position: relative !important;
  padding: 3.5px !important;
  border: 0 !important;
  border-radius: 0 !important;
  transform: none !important;
  background: linear-gradient(
    135deg,
    #646c7a 0%,
    #e2e8f0 22%,
    #94a0b2 44%,
    #ffffff 50%,
    #788292 58%,
    #d8e0ea 82%,
    #58606e 100%
  ) !important;
  clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px) !important;
  box-shadow:
    0 14px 30px rgba(0, 0, 0, .72),
    0 0 10px rgba(203, 213, 225, .14) !important;
  transition: box-shadow .28s ease, filter .28s ease !important;
}
.tc-shell:not(.is-champ):hover .tc-frame {
  box-shadow:
    0 18px 36px rgba(0, 0, 0, .82),
    0 0 18px rgba(226, 232, 240, .28) !important;
}

/* ③ 찜한(챔피언) 프로필 테두리: 깊고 중후한 24K 샴페인·앤틱 럭셔리 골드 크롬 + 마우스 추적 스페큘러 광택 */
.tc-shell.is-champ .tc-frame {
  transform: none !important;
  background:
    radial-gradient(
      165px circle at var(--gx, 50%) var(--gy, 50%),
      rgba(255, 253, 240, .98) 0%,
      rgba(247, 218, 132, .92) 30%,
      rgba(198, 146, 46, .48) 60%,
      transparent 100%
    ),
    linear-gradient(
      135deg,
      #63450e 0%,
      #e6c670 22%,
      #9a6d1c 44%,
      #fff6d1 51%,
      #a67720 58%,
      #ebd082 80%,
      #593d0b 100%
    ) !important;
  box-shadow:
    0 15px 34px rgba(0, 0, 0, .8),
    0 0 18px rgba(226, 184, 78, .32) !important;
}
.tc-shell.is-champ:hover .tc-frame {
  transform: none !important;
  background:
    radial-gradient(
      195px circle at var(--gx, 50%) var(--gy, 50%),
      #ffffff 0%,
      #fff8db 26%,
      #f0cb69 52%,
      rgba(196, 144, 42, .42) 78%,
      transparent 100%
    ),
    linear-gradient(
      135deg,
      #63450e 0%,
      #e6c670 22%,
      #9a6d1c 44%,
      #fff6d1 51%,
      #a67720 58%,
      #ebd082 80%,
      #593d0b 100%
    ) !important;
  box-shadow:
    0 20px 40px rgba(0, 0, 0, .88),
    0 0 28px rgba(240, 198, 96, .52) !important;
}

/* ④ 내부 이미지 영역 & 하단 가독성 쉐이드 */
.tc-shell .card-image-button,
.tc-shell .card-image-link {
  display: block !important;
  width: 100% !important;
  padding: 0 !important;
  margin: 0 !important;
  border: 0 !important;
  background: transparent !important;
}
.tc-shell .card-image,
.tc-shell:hover .card-image {
  position: relative !important;
  width: 100% !important;
  aspect-ratio: 5 / 7 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  box-shadow: none !important;
  background: #09090d !important;
  border-radius: 0 !important;
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px) !important;
  overflow: hidden !important;
}
.tc-shell .card-image::after {
  content: "" !important;
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 2 !important;
  pointer-events: none !important;
  box-shadow: none !important;
  background: linear-gradient(
    to bottom,
    rgba(6, 6, 9, 0) 46%,
    rgba(6, 6, 9, .68) 76%,
    rgba(4, 4, 7, .97) 100%
  ) !important;
}

/* ⑤ 고휘도·고가독성 대형 메탈릭 이름 (어두운 중간 띠 완전 제거 + 글자 크기 대폭 확대 + 칼같은 입체 베벨) */
.tc-shell .card-caption.tc-nameplate,
.tc-shell .card-caption.tc-nameplate:hover {
  position: absolute !important;
  left: 5px !important;
  right: 5px !important;
  bottom: 10px !important;
  z-index: 9 !important;
  padding: 0 2px !important;
  border: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  text-align: center !important;
  pointer-events: auto !important;
  overflow: visible !important;
  color: inherit !important;
}

/* 평소 프로필: 어두운 회색 음영 없이 눈부시게 밝은 플래티넘 실버 메탈릭 + 칼같은 3D 다크 베벨 */
.tc-shell .tc-name-text {
  display: block !important;
  width: 100% !important;
  font-family: "Barlow Condensed", "Oswald", "Noto Sans KR", sans-serif !important;
  font-style: italic !important;
  font-weight: 900 !important;
  /* 기본 글자 크기를 대폭 키워 한눈에 시원하게 들어오게 설정 */
  font-size: clamp(23px, 2.05vw, 31px) !important;
  line-height: 1.05 !important;
  letter-spacing: .025em !important;
  text-transform: uppercase !important;
  white-space: nowrap !important;
  overflow: visible !important;
  text-overflow: clip !important;
  max-height: none !important;
  padding-bottom: 2px !important;
  /* 어두운 중간띠를 완전히 없애고 밝은 순백~밝은 실버 톤으로만 구성된 고휘도 실버 그라데이션 */
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #f8fafc 38%,
    #cbd5e1 68%,
    #f1f5f9 100%
  ) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: transparent !important;
  -webkit-text-fill-color: transparent !important;
  text-shadow: none !important;
  /* 먹물처럼 번지던 다중 블러를 빼고, 또렷한 1px·2px 솔리드 3D 입체 엣지 + 하단 그림자만 적용 */
  filter:
    drop-shadow(0 1px 0 #090a0f)
    drop-shadow(0 2.5px 0 #000000)
    drop-shadow(0 4px 7px rgba(0, 0, 0, .92)) !important;
  transition: transform .24s ease, filter .24s ease !important;
}

/* 중간 길이 이름(15~20자, 예: ALEXANDER GREY, CHANNING DECKER)도 큼직하게 한 줄 유지 */
.tc-shell .tc-name-text.is-long {
  font-size: clamp(19.5px, 1.68vw, 25px) !important;
  letter-spacing: .015em !important;
}
/* 아주 긴 이름(21자 이상)도 잘리지 않고 선명하게 한 줄 유지 */
.tc-shell .tc-name-text.is-xlong {
  font-size: clamp(15.5px, 1.32vw, 20px) !important;
  letter-spacing: 0em !important;
}

/* 카드나 이름에 마우스를 올렸을 때 어두워지지 않고 오히려 더 밝고 선명하게 빛남! */
.tc-shell:hover .tc-name-text,
.tc-shell .card-caption.tc-nameplate:hover .tc-name-text {
  transform: translateY(-2px) scale(1.02) !important;
  filter:
    brightness(1.1)
    drop-shadow(0 1px 0 #090a0f)
    drop-shadow(0 2.5px 0 #000000)
    drop-shadow(0 5px 10px rgba(0, 0, 0, .96)) !important;
}

/* 찜한(챔피언) 프로필 이름: 어두운 갈색을 완전히 뺀 고휘도 24K 샴페인·선샤인 골드 메탈릭 */
.tc-shell.is-champ .tc-name-text {
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #fff9db 28%,
    #fde047 64%,
    #f59e0b 90%,
    #fef08a 100%
  ) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: transparent !important;
  -webkit-text-fill-color: transparent !important;
  filter:
    drop-shadow(0 1px 0 #1c1102)
    drop-shadow(0 2.5px 0 #000000)
    drop-shadow(0 4px 8px rgba(0, 0, 0, .95))
    drop-shadow(0 0 8px rgba(250, 204, 21, .28)) !important;
}
.tc-shell.is-champ:hover .tc-name-text,
.tc-shell.is-champ .card-caption.tc-nameplate:hover .tc-name-text {
  transform: translateY(-2px) scale(1.02) !important;
  filter:
    brightness(1.12)
    drop-shadow(0 1px 0 #1c1102)
    drop-shadow(0 2.5px 0 #000000)
    drop-shadow(0 5px 10px rgba(0, 0, 0, .98))
    drop-shadow(0 0 12px rgba(253, 224, 71, .45)) !important;
}

@media (max-width: 640px) {
  .tc-shell .tc-name-text {
    font-size: 19px !important;
  }
  .tc-shell .tc-name-text.is-long {
    font-size: 16px !important;
  }
  .tc-shell .tc-name-text.is-xlong {
    font-size: 13.5px !important;
  }
}

/* ⑥ 찜(챔피언 벨트) 버튼: ON/OFF 모두 배경 완전 제거 + 미선택 시 아이콘 근처로 마우스 호버할 때만 OFF 실버 벨트 표시 */
.tc-shell .favorite-button,
.tc-shell:hover .favorite-button,
.tc-shell.is-champ .favorite-button.is-favorite,
.tc-shell .favorite-button:hover,
.tc-shell .favorite-button.is-favorite {
  left: 6px !important;
  right: auto !important;
  top: 6px !important;
  width: 58px !important;
  height: 44px !important;
  padding: 6px 0 0 7px !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  display: flex !important;
  align-items: flex-start !important;
  justify-content: flex-start !important;
  z-index: 14 !important;
}
.tc-shell .favorite-button:not(.is-favorite),
.tc-shell:hover .favorite-button:not(.is-favorite) {
  opacity: 0 !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(.94);
  transition: opacity .2s ease, transform .22s ease !important;
}
.tc-shell .favorite-button:not(.is-favorite):hover,
.tc-shell .favorite-button:not(.is-favorite):focus-visible {
  opacity: 1 !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(1.06) !important;
}
.tc-shell .favorite-button.is-favorite,
.tc-shell:hover .favorite-button.is-favorite,
.tc-shell.is-champ .favorite-button.is-favorite {
  opacity: 1 !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(1);
}
.tc-shell .favorite-button.is-favorite:hover,
.tc-shell.is-champ .favorite-button.is-favorite:hover {
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(1.12) !important;
}
.tc-shell .favorite-button svg.champ-belt-svg {
  width: 42px !important;
  height: 28px !important;
  display: block !important;
  background: transparent !important;
  filter:
    drop-shadow(0 1.5px 2px rgba(0, 0, 0, .95))
    drop-shadow(0 0 2px rgba(0, 0, 0, .85)) !important;
}
.tc-shell .favorite-button.is-favorite svg.champ-belt-svg {
  width: 44px !important;
  height: 30px !important;
  background: transparent !important;
  filter:
    drop-shadow(0 2px 3px rgba(0, 0, 0, .98))
    drop-shadow(0 0 8px rgba(226, 184, 78, .55)) !important;
}
