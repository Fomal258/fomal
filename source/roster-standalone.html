    <title>ROSTER | RING ROSTER</title>
    <style>
/* ============================================================
   RING ROSTER — 사이트 전체 스타일
   ------------------------------------------------------------
   · 색/글꼴/여백은 대부분 아래 CSS 변수(--brand-accent 등)와
     client/src/lib/design.ts 의 기본값에서 옵니다.
   · 카드 크기/열: .roster-grid, .wrestler-card
   · 카드 호버 효과: .card-shell:hover, .card-image img
   · 모바일 대응: 맨 아래 @media 블록들
   · 순서: 기본 → 헤더 → 히어로 → 로스터 → 카드 → 팝업 → 반응형
   ============================================================ */

@import "tailwindcss";

/* ────────────────────────────────────────────────────────────
   1. 기본값 (폰트 · 색 · 리셋)
   ──────────────────────────────────────────────────────────── */
:root {
  font-family: Inter, "Noto Sans KR", sans-serif;
  color: #111;
  background: #090909;
  font-synthesis: none;
  scroll-behavior: smooth;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-width: 320px;
}
button, input {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
}
a {
  color: inherit;
  text-decoration: none;
}
.site-shell {
  overflow-x: clip;
}
.site-header {
  height: 70px;
  background: #070707;
  color: #fff;
  border-bottom: 1px solid #222;
}
.header-inner {
  max-width: 1400px;
  height: 100%;
  margin: auto;
  padding: 0 48px;
  display: flex;
  align-items: center;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: #fff;
  flex: none;
}
.brand-mark {
  width: 33px;
  height: 30px;
  display: flex;
  gap: 3px;
  align-items: center;
  transform: skew(-17deg);
  overflow: hidden;
}
.brand-mark i {
  display: block;
  width: 7px;
  height: 28px;
  background: #e11d30;
}
.brand-mark i:nth-child(2) {
  height: 23px;
}
.brand-mark i:nth-child(3) {
  height: 18px;
}
.brand-type {
  display: flex;
  flex-direction: column;
  font-family: "Barlow Condensed", sans-serif;
  line-height: .75;
  letter-spacing: -.02em;
  transform: skew(-7deg);
}
.brand-type b {
  font-size: 26px;
  font-weight: 900;
}
.brand-type small {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .26em;
  margin-top: 5px;
}
.main-nav {
  align-self: stretch;
  display: flex;
  gap: 37px;
  margin-left: 92px;
}
.main-nav a {
  display: flex;
  align-items: center;
  position: relative;
  color: #999;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .1em;
}
.main-nav a:hover, .main-nav a.active {
  color: #fff;
}
.main-nav a.active:after {
  position: absolute;
  content: "";
  height: 3px;
  background: #e41c31;
  bottom: 0;
  left: 0;
  right: 0;
}
.header-edit {
  margin-left: auto;
  border: 1px solid #4c4c4c;
  background: transparent;
  color: #fff;
  height: 36px;
  padding: 0 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 700;
  transition: border-color .2s, background .2s;
}
.header-edit:hover, .header-edit.is-active {
  background: #c9162b;
  border-color: #c9162b;
}
.hero {
  height: 260px;
  background: #0b0b0b;
  color: white;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
}
.hero:before, .hero:after {
  content: "";
  position: absolute;
  width: 45%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #2c2c2c, transparent);
  transform: rotate(-38deg);
}
.hero:before {
  left: -10%;
  top: 50%;
}
.hero:after {
  right: -10%;
  bottom: 35%;
}
.hero-line {
  width: 120px;
  height: 300px;
  position: absolute;
  opacity: .35;
  transform: skew(-28deg);
  background: linear-gradient(90deg, transparent 0 20%, #171717 20% 23%, transparent 23% 44%, #171717 44% 47%, transparent 47% 68%, #171717 68% 71%, transparent 71%);
}
.hero-line-left {
  left: 14%;
}
.hero-line-right {
  right: 14%;
}
.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
}
.hero-eyebrow {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 700;
  letter-spacing: .27em;
  color: #a5a5a5;
  font-size: 11px;
}
.hero-eyebrow span {
  width: 23px;
  height: 1px;
  background: #cb1d2d;
}
.hero h1 {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(52px, 5.8vw, 82px);
  line-height: .95;
  letter-spacing: -.015em;
  font-style: italic;
  font-weight: 900;
  margin: 13px 0 10px;
}
.hero h1 em {
  color: #e42135;
  font-style: inherit;
}
.hero p {
  margin: 0;
  color: #b3b3b3;
  font-size: 12px;
  letter-spacing: .03em;
}
.roster-section {
  background: #fff;
  min-height: 700px;
  padding: 62px 0 72px;
}
.section-inner {
  width: min(100% - 96px, 1304px);
  margin: auto;
}
.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 39px;
}
.overline {
  color: #a01929;
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 800;
  font-size: 12px;
  letter-spacing: .22em;
  display: flex;
  align-items: center;
  gap: 9px;
}
.overline span {
  display: block;
  background: #d21a30;
  width: 19px;
  height: 2px;
}
.section-heading h2 {
  margin: 8px 0 3px;
  color: #090909;
  font: italic 900 52px/.92 "Barlow Condensed", sans-serif;
  letter-spacing: -.015em;
}
.section-heading h2 span {
  color: #d8192e;
}
.section-heading p {
  margin: 12px 0 0;
  color: #7c7c7c;
  font-size: 12px;
}
.roster-toolbar {
  flex-wrap: wrap;
  border-top: 2px solid #171717;
  border-bottom: 1px solid #ddd;
  min-height: 63px;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 20px;
}
.toolbar-left {
  display: flex;
  align-items: center;
  gap: 9px;
  position: relative;
}
.toolbar-left:after {
  content: "";
  position: absolute;
  bottom: -1px;
  height: 3px;
  left: 0;
  width: 100%;
  background: #d51b30;
}
.tab-active {
  font: 800 16px "Barlow Condensed", sans-serif;
  letter-spacing: .06em;
}
.count {
  font: 700 11px "Barlow Condensed", sans-serif;
  color: #ce182b;
  padding: 2px 5px;
  background: #f9e9eb;
}
.toolbar-right {
  display: flex;
  align-items: center;
  gap: 19px;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #8c8c8c;
  min-width: 170px;
}
.search-box input {
  border: 0;
  outline: 0;
  min-width: 0;
  width: 138px;
  background: transparent;
  color: #222;
  font-size: 12px;
}
.search-box input::placeholder {
  color: #a0a0a0;
}
.search-box button {
  border: 0;
  background: none;
  color: #777;
  padding: 3px;
  display: flex;
}
.columns-control {
  display: flex;
  align-items: center;
  gap: 8px;
  border-left: 1px solid #e1e1e1;
  padding-left: 20px;
  color: #555;
  font-size: 11px;
  font-weight: 700;
}
.columns-control strong {
  min-width: 10px;
  text-align: center;
  color: #111;
  font-size: 12px;
}
.columns-control button {
  width: 23px;
  height: 23px;
  border: 1px solid #ddd;
  background: #fff;
  display: grid;
  place-items: center;
  padding: 0;
  color: #444;
}
.columns-control button:hover:not(:disabled) {
  background: #111;
  color: #fff;
  border-color: #111;
}
.columns-control button:disabled {
  opacity: .35;
}
.columns-chevron {
  display: none;
}
.roster-note {
  color: #a3a3a3;
  font-size: 10px;
  margin: 17px 0 16px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.roster-grid {
  display: grid;
  column-gap: 16px;
  row-gap: 29px;
}
.wrestler-card {
  display: block;
  text-align: left;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  min-width: 0;
  color: #161616;
}
.card-image {
  aspect-ratio: 4 / 5;
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #d6d6d6;
}
.card-stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: center;
}
.card-image:after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
}
.card-image img {
  display: block;
  width: auto;
  height: auto;
  min-width: 100%;
  min-height: 100%;
  max-width: none;
  max-height: none;
  object-fit: cover;
  transition: transform .3s ease, filter .3s ease;
}
.wrestler-card:hover .card-image img {
  transform: scale(1.045);
  filter: brightness(.85);
}
.card-edit {
  display: grid;
  place-items: center;
  position: absolute;
  right: 8px;
  top: 8px;
  color: #fff;
  background: rgba(0,0,0,.68);
  width: 28px;
  height: 28px;
  opacity: 0;
  transition: opacity .2s;
}
.wrestler-card:hover .card-edit, .wrestler-card:focus-visible .card-edit, .wrestler-card.editing .card-edit {
  opacity: 1;
}
.card-caption {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-size: clamp(12px, 1vw, 15px);
  font-weight: 800;
  line-height: 1.3;
  padding-top: 10px;
}
.card-arrow {
  opacity: 0;
  color: #d51b30;
  transition: opacity .2s;
}
.wrestler-card:hover .card-arrow {
  opacity: 1;
}
.image-placeholder {
  width: 100%;
  height: 100%;
  background: linear-gradient(140deg, #ddd, #bbb);
  color: #777;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 9px;
  font-size: 10px;
}
.add-card {
  aspect-ratio: 4 / 5;
  border: 1px dashed #c8c8c8;
  background: #fafafa;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #555;
  transition: border-color .2s, color .2s, background .2s;
}
.add-card:hover {
  background: #fff5f6;
  border-color: #d51b30;
  color: #d51b30;
}
.add-card > span {
  width: 39px;
  height: 39px;
  border: 1px solid #ccc;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin-bottom: 5px;
}
.add-card strong {
  font-size: 12px;
}
.add-card small {
  color: #999;
  font-size: 9px;
}
.empty-state {
  min-height: 190px;
  color: #888;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 9px;
  font-size: 12px;
}
.empty-state strong {
  color: #333;
  font-size: 14px;
}
.storage-error {
  background: #fff1f2;
  border-left: 3px solid #d51b30;
  color: #a01828;
  padding: 12px 15px;
  font-size: 12px;
}
.under-grid {
  border-top: 1px solid #e6e6e6;
  margin-top: 42px;
  padding-top: 19px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.under-grid > span {
  color: #363636;
  font: 800 11px "Barlow Condensed", sans-serif;
  letter-spacing: .14em;
}
.under-grid i {
  width: 6px;
  height: 6px;
  background: #e01c32;
  display: inline-block;
  margin-right: 7px;
  vertical-align: middle;
}
.under-grid p {
  margin: 0;
  color: #a0a0a0;
  font-size: 10px;
}
.editor-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0,0,0,.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.editor-modal {
  width: min(440px, 100%);
  max-height: min(90vh, 760px);
  overflow-y: auto;
  background: #fff;
  box-shadow: 0 20px 80px rgba(0,0,0,.35);
}
.editor-header {
  padding: 21px 24px;
  background: #111;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #fff;
}
.editor-header h2 {
  font-size: 18px;
  margin: 0;
  font-weight: 800;
}
.editor-header .editor-secondary {
  background: transparent;
  color: #aaa;
  border: 0;
  padding: 4px;
  font-size: 12px;
}
.editor-body {
  padding: 24px;
}
.editor-preview {
  height: 210px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #efefef;
  color: #999;
  font-size: 12px;
  overflow: hidden;
}
.editor-preview img {
  height: 100%;
  width: 100%;
  object-fit: contain;
}
.editor-upload {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 15px 0 24px;
}
.editor-upload label, .editor-field label {
  font-size: 12px;
  font-weight: 700;
  color: #333;
}
.editor-upload input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  overflow: hidden;
}
.editor-upload .editor-secondary {
  margin-left: auto;
}
.editor-field {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.editor-field label span {
  color: #d51b30;
}
.editor-field input {
  width: 100%;
  height: 43px;
  padding: 0 12px;
  border: 1px solid #d3d3d3;
  outline: none;
  font-size: 13px;
}
.editor-field input:focus {
  border-color: #d51b30;
}
.editor-error {
  margin: 12px 0 0;
  font-size: 12px;
  color: #c41529;
}
.editor-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 28px;
}
.editor-actions-spacer {
  flex: 1;
}
.editor-secondary, .editor-primary, .editor-delete {
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #d4d4d4;
  background: #fff;
  color: #333;
  font-size: 12px;
  font-weight: 700;
}
.editor-primary {
  background: #d51b30;
  border-color: #d51b30;
  color: #fff;
}
.editor-primary:hover {
  background: #b41528;
}
.editor-delete {
  color: #bf172b;
  border-color: transparent;
  padding-left: 0;
}

@media (max-width: 1023px) {
  .header-inner {
    padding: 0 30px;
  }
  .section-inner {
    width: calc(100% - 60px);
  }
  .hero {
    height: 235px;
  }
}

@media (max-width: 600px) {
  .site-header {
    height: 62px;
  }
  .header-inner {
    padding: 0 20px;
  }
  .main-nav {
    margin-left: 35px;
    gap: 20px;
  }
  .main-nav a {
    font-size: 12px;
  }
  .main-nav a:nth-child(2) {
    display: none;
  }
  .header-edit {
    padding: 0 10px;
    height: 32px;
  }
  .brand-mark {
    width: 27px;
    height: 25px;
  }
  .brand-mark i {
    width: 6px;
    height: 23px;
  }
  .brand-type b {
    font-size: 22px;
  }
  .brand-type small {
    font-size: 9px;
  }
  .hero {
    height: 220px;
  }
  .hero h1 {
    font-size: 51px;
  }
  .hero-line-left {
    left: -5%;
  }
  .hero-line-right {
    right: -5%;
  }
  .roster-section {
    padding: 44px 0 55px;
  }
  .section-inner {
    width: calc(100% - 40px);
  }
  .section-heading {
    margin-bottom: 27px;
    gap: 10px;
  }
  .section-heading h2 {
    font-size: 42px;
  }
  .section-heading p {
    line-height: 1.6;
    max-width: 220px;
  }
  .roster-toolbar {
    flex-wrap: wrap;
    gap: 0;
    padding: 0 0 11px;
  }
  .toolbar-left {
    min-height: 48px;
    width: 100%;
  }
  .toolbar-left:after {
    width: 145px;
    bottom: 0;
  }
  .toolbar-right {
    width: 100%;
    justify-content: space-between;
    padding-top: 13px;
  }
  .search-box {
    flex: 1;
  }
  .roster-note {
    line-height: 1.5;
  }
  .desktop-note {
    display: none;
  }
  .roster-grid {
    gap: 22px 12px;
  }
  .card-caption {
    font-size: 13px;
  }
  .card-edit {
    opacity: .9;
  }
  .under-grid {
    align-items: flex-start;
    flex-direction: column;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}
.brand-mark i, .main-nav a.active:after, .hero-eyebrow span, .overline span, .toolbar-left:after, .under-grid i {
  background-color: var(--brand-accent, #d61a30);
}
.hero h1 em, .section-heading h2 span, .card-arrow {
  color: var(--brand-accent, #d61a30);
}
.header-edit.is-active, .hero-custom-button {
  background-color: var(--brand-accent, #d61a30);
}
.hero {
  height: auto;
  min-height: 260px;
}
.hero-content {
  width: min(100% - 96px, 1304px);
  padding: 40px 0;
}
.hero-content p + p {
  margin-top: 9px;
}
.hero-custom-button {
  display: inline-flex;
  padding: 11px 20px;
  margin-top: 20px;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}
.search-wrap {
  position: relative;
}
.sort-control {
  display: flex;
  align-items: center;
  gap: 7px;
  border-left: 1px solid #e1e1e1;
  padding-left: 18px;
  color: #555;
  font-size: 11px;
  font-weight: 700;
}
.sort-control select {
  border: 0;
  background: transparent;
  outline: 0;
  color: #222;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 0;
}
.search-suggestions {
  position: absolute;
  z-index: 20;
  top: calc(100% + 12px);
  left: -12px;
  width: max(235px, 100%);
  background: white;
  border: 1px solid #e3e3e3;
  box-shadow: 0 10px 25px #0002;
  padding: 5px 0;
}
.search-suggestions button {
  width: 100%;
  min-height: 42px;
  border: 0;
  background: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  text-align: left;
  color: #222;
  font-size: 12px;
}
.search-suggestions button:hover, .search-suggestions button.selected {
  background: #f5f5f5;
}
.search-suggestions button > span:nth-child(2) {

}
.search-suggestions button > svg {

}
.search-suggestions img, .suggestion-placeholder {

.editor-modal .editor-field input:focus, .editor-modal .editor-field textarea:focus {
  border-color: var(--profile-modal-accent, #d61a30);
}
.editor-modal .editor-primary, .info-link {
  background: var(--profile-modal-accent, #d61a30);
  border-color: var(--profile-modal-accent, #d61a30);
}
.editor-modal .editor-field label span, .info-kicker {
  color: var(--profile-modal-accent, #d61a30);
}
.info-header h2 {
  color: #fff;
}
.info-copy h3 {
  color: var(--profile-modal-text, #111);
}
.design-help {
  margin: -4px 0 14px;
  color: #888;
  font-size: 11px;
  line-height: 1.5;
}

/* ────────────────────────────────────────────────────────────
   13. 링크 선택 팝업 · 이름/링크 입력 목록
   ──────────────────────────────────────────────────────────── */
.card-link-count {
  position: absolute;
  left: 9px;
  bottom: 9px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .72);
  color: #fff;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .04em;
}
.link-pop-backdrop {
  position: fixed;
  inset: 0;
  z-index: 70;
}
.link-pop {
  position: fixed;
  z-index: 71;
  width: 200px;
  padding: 6px;
  background: #fff;
  border: 1px solid #111;
  box-shadow: 0 14px 34px rgba(0, 0, 0, .22);
}
.link-pop-title {
  margin: 2px 0 4px;
  padding: 4px 8px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #9a9aa2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.link-pop a {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 8px;
  color: #111;
  font-size: 12px;
  font-weight: 700;
}
.link-pop a:hover,
.link-pop a:focus-visible {
  background: #111;
  color: #fff;
}
.link-pop em {
  font-style: normal;
  font-size: 10px;
  color: #6b6b74;
  white-space: nowrap;
}
.link-pop a:hover em {
  color: rgba(255, 255, 255, .6);
}

/* 이름/링크 여러 줄 입력 */
.row-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.row-item {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 3px 5px;
  border: 1px solid transparent;
}
.row-item.is-dragging {
  opacity: .4;
}
.row-item.is-over {
  border-color: #d51b30;
  background: #fff7f8;
}
.row-drag {
  color: #b3b3bb;
  font-size: 15px;
  line-height: 1;
  cursor: grab;
  user-select: none;
}
.row-actions {
  display: flex;
  gap: 4px;
}
.row-actions button {
  width: 28px;
  height: 43px;
  border: 1px solid #d3d3d3;
  background: #fff;
  color: #77777f;
  font-size: 12px;
  line-height: 1;
}
.row-actions button:disabled {
  opacity: .25;
  background: #f4f4f5;
  cursor: not-allowed;
}
.row-actions button:hover:not(:disabled) {
  border-color: #111;
  color: #111;
}
.row-remove:hover:not(:disabled) {
  border-color: #d51b30;
  color: #d51b30;
}
.row-add {
  width: 100%;
  height: 36px;
  margin-top: 2px;
  padding: 0 11px;
  border: 1px dashed #cfcfd4;
  background: transparent;
  color: #55555f;
  font-size: 12px;
  font-weight: 700;
}
.row-add:hover {
  border-color: #111;
  color: #111;
}
.row-empty {
  margin: 0;
  font-size: 11px;
  color: #9a9aa2;
  line-height: 1.5;
}
.editor-hint {
  display: block;
  margin: 4px 0 0;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.45;
  color: #7f7f88;
}
.editor-modal .editor-field .row-actions button {
  background: var(--profile-modal-field-bg, #fafafa);
  color: var(--profile-modal-text, #111);
  border-color: color-mix(in srgb, var(--profile-modal-text, #111) 22%, #fff);
}
@media (max-width: 640px) {
  .row-item {
    grid-template-columns: 14px 1fr auto;
    gap: 6px;
  }
  .row-actions button {
    width: 24px;
  }
}

/* ────────────────────────────────────────────────────────────
   14. 이름 첫 글자 필터 (알파벳 · 숫자)
   ──────────────────────────────────────────────────────────── */
.alpha-filter {
  flex: 0 0 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  order: 3;
  padding: 9px 0 10px;
  border-top: 1px solid #ececef;
}
.alpha-label {
  margin-right: 6px;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #9a9aa2;
}
.alpha-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 25px;
  height: 25px;
  padding: 0 5px;
  border: 1px solid #dcdfe1;
  background: transparent;
  color: #5b5b64;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .02em;
  transition: border-color .15s ease, color .15s ease, background-color .15s ease;
}
.alpha-chip:hover:not(:disabled) {
  border-color: #111;
  color: #111;
}
.alpha-chip.is-active {
  background: #111;
  border-color: #111;
  color: #fff;
}
.alpha-chip:disabled {
  opacity: .3;
  cursor: not-allowed;
}
@media (max-width: 640px) {
  .alpha-filter {
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-right: 30px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    mask-image: linear-gradient(to right, #000 calc(100% - 42px), transparent);
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 42px), transparent);
  }
  .alpha-filter::-webkit-scrollbar {
    display: none;
  }
  .alpha-label,
  .alpha-chip {
    flex: 0 0 auto;
  }
}

/* ────────────────────────────────────────────────────────────
   15. 프로필 사진 위치·크기 조절 (크롭)
   ──────────────────────────────────────────────────────────── */
.card-image img,
.info-image img {
  transform-origin: center;
}
.crop {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.crop-box {
  position: relative;
  width: min(100%, 300px);
  aspect-ratio: 5 / 7;
  margin: 0 auto;
  overflow: hidden;
  background: var(--profile-modal-field-bg, #fafafa);
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.crop-box.is-dragging {
  cursor: grabbing;
}
.crop-box.is-locked {
  cursor: default;
}
.crop-box:focus-visible {
  outline: 2px solid var(--profile-modal-accent, #d61a30);
  outline-offset: 2px;
}
.crop-hint strong {
  font-weight: 700;
  color: var(--profile-modal-text, #111);
}
.crop-stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: center;
}
.crop-box img {
  display: block;
  width: auto;
  height: auto;
  min-width: 100%;
  min-height: 100%;
  max-width: none;
  max-height: none;
  object-fit: cover;
  pointer-events: none;
}
.crop-guide {
  position: absolute;
  background: var(--profile-modal-accent, #d61a30);
  opacity: .8;
  pointer-events: none;
}
.crop-guide-v {
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
}
.crop-guide-h {
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
}
.crop-snap {
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  padding: 3px 8px;
  background: rgba(0, 0, 0, .72);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
}
.crop-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.crop-zoom {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  font-size: 11px;
  color: #66666f;
}
.crop-zoom input[type="range"] {
  flex: 1;
  accent-color: #111;
}
.crop-zoom strong {
  min-width: 40px;
  text-align: right;
  font-size: 11px;
  color: var(--profile-modal-text, #111);
}
.crop-reset {
  height: 30px;
  padding: 0 10px;
  border: 1px solid #d3d3d3;
  background: #fff;
  color: #55555f;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.crop-reset:hover {
  border-color: #111;
  color: #111;
}
.crop-hint {
  margin: 0;
  font-size: 11px;
  line-height: 1.5;
  color: #8a8a92;
}
@media (max-width: 480px) {
  .crop-controls {
    flex-direction: column;
    align-items: stretch;
  }
  .crop-reset {
    height: 34px;
  }
}

/* 축소했을 때 빈 공간이 허전하지 않도록 사진을 흐리게 깔아 줍니다 */
.card-fill,
.crop-fill {
  position: absolute;
  inset: -12%;
  background-size: cover;
  background-position: center;
  filter: blur(16px) brightness(.92);
  opacity: .9;
  pointer-events: none;
}

.card-stage.is-shrunk img,
.crop-stage.is-shrunk img {
  box-shadow: 0 12px 34px rgba(0, 0, 0, .38);
}

/* 디자인 편집 미리보기: 프로필 팝업 샘플 */
.design-preview-popup {
  margin: 6px 8px;
  padding: 0 0 10px;
  border-style: solid;
  overflow: hidden;
  font-size: 9px;
}
.design-preview-popup-head {
  display: block;
  padding: 5px 8px;
  color: #fff;
  font-size: 7px;
  font-weight: 800;
  letter-spacing: .14em;
}
.design-preview-popup b {
  display: block;
  padding: 8px 9px 2px;
  font-size: 12px;
  font-weight: 900;
}
.design-preview-popup p {
  margin: 0;
  padding: 0 9px;
  font-size: 8px;
  opacity: .75;
}

/* 프로필 팝업: 배경 위 글자가 묻히지 않게 덮는 막 */
.info-modal:before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, var(--profile-modal-overlay, 0));
  pointer-events: none;
}
.info-modal > * {
  position: relative;
  z-index: 1;
}
.design-preview-popup:before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, var(--preview-overlay, 0));
  pointer-events: none;
}
.design-preview-popup {
  position: relative;
}
.design-preview-popup > * {
  position: relative;
  z-index: 1;
}

/* ────────────────────────────────────────────────────────────
   16. 프로필 팝업 열림/닫힘 애니메이션
   ──────────────────────────────────────────────────────────── */
@keyframes modal-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes modal-fade-out {
  from { opacity: 1; }
  to { opacity: 0; }
}
@keyframes modal-slide-in {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: none; }
}
@keyframes modal-slide-out {
  from { opacity: 1; transform: none; }
  to { opacity: 0; transform: translateY(30px); }
}
@keyframes modal-zoom-in {
  from { opacity: 0; transform: scale(.94); }
  to { opacity: 1; transform: none; }
}
@keyframes modal-zoom-out {
  from { opacity: 1; transform: none; }
  to { opacity: 0; transform: scale(.94); }
}

/* 배경(어둡게 깔리는 막)은 항상 페이드 */
.info-backdrop.anim-fade,
.info-backdrop.anim-slide,
.info-backdrop.anim-zoom {
  animation: modal-fade-in var(--modal-duration, 260ms) ease both;
}
.info-backdrop.is-closing {
  animation: modal-fade-out var(--modal-duration, 260ms) ease both;
}

.info-modal.anim-fade,
.design-preview-popup.anim-fade {
  animation: modal-fade-in var(--modal-duration, 260ms) ease both;
}
.info-modal.anim-slide,
.design-preview-popup.anim-slide {
  animation: modal-slide-in var(--modal-duration, 260ms) cubic-bezier(.18, .89, .32, 1.12) both;
}
.info-modal.anim-zoom,
.design-preview-popup.anim-zoom {
  animation: modal-zoom-in var(--modal-duration, 260ms) cubic-bezier(.18, .89, .32, 1.12) both;
}
.info-modal.anim-fade.is-closing {
  animation: modal-fade-out var(--modal-duration, 260ms) ease both;
}
.info-modal.anim-slide.is-closing {
  animation: modal-slide-out var(--modal-duration, 260ms) ease both;
}
.info-modal.anim-zoom.is-closing {
  animation: modal-zoom-out var(--modal-duration, 260ms) ease both;
}

/* 미리보기 다시 재생 버튼 */
.design-replay {
  display: block;
  width: 100%;
  height: 28px;
  margin: 2px 0 8px;
  border: 1px dashed #cfcfd4;
  background: transparent;
  color: #55555f;
  font-size: 11px;
  font-weight: 700;
}
.design-replay:hover {
  border-color: #111;
  color: #111;
}

@media (prefers-reduced-motion: reduce) {
  .info-backdrop,
  .info-modal,
  .design-preview-popup {
    animation: none !important;
  }
}

/* ────────────────────────────────────────────────────────────
   17. 히어로 마퀴 · 카드 호버 · 스크롤 등장
   ──────────────────────────────────────────────────────────── */

/* 카드 호버: 살짝 떠오르고, 이름이 올라오며 밑줄·배지가 나타남 */
.wrestler-card {
  transition: transform .26s cubic-bezier(.2, .8, .2, 1);
}
.card-shell {
  transition: box-shadow .28s ease;
}
.card-shell:hover {
  box-shadow: 0 18px 30px -20px rgba(0, 0, 0, .45);
}
.card-shell:hover .wrestler-card {
  transform: translateY(-6px);
}
.card-caption {
  position: relative;
}
.card-caption span:first-child {
  display: inline-block;
  transform: translateY(4px);
  opacity: .92;
  transition: transform .28s cubic-bezier(.2, .8, .2, 1), opacity .28s ease;
}
.card-shell:hover .card-caption span:first-child,
.card-shell:focus-within .card-caption span:first-child {
  transform: translateY(0);
  opacity: 1;
}


.card-link-count {
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .25s ease, transform .25s ease;
}
.card-shell:hover .card-link-count,
.card-shell:focus-within .card-link-count {
  opacity: 1;
  transform: none;
}
/* 터치 기기에서는 호버가 없으니 항상 보이게 */
@media (hover: none) {
  .card-link-count {
    opacity: 1;
    transform: none;
  }
}

/* 스크롤 등장 */
.reveal-on .card-shell {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity .5s ease, transform .55s cubic-bezier(.2, .8, .2, 1);
}
.reveal-on .card-shell.is-visible {
  opacity: 1;
  transform: none;
}

@media (prefers-reduced-motion: reduce) {
  .reveal-on .card-shell {
    opacity: 1;
    transform: none;
    transition: none;
  }
  .card-shell:hover .wrestler-card {
    transform: none;
  }
}

/* ────────────────────────────────────────────────────────────
   18. 스티키 툴바 · 필터 전환 모션
   ──────────────────────────────────────────────────────────── */
.roster-toolbar {
  position: sticky;
  top: 0;
  z-index: 30;
}
.roster-toolbar.is-stuck {
  box-shadow: 0 12px 20px -16px rgba(0, 0, 0, .5);
}
@supports (position: sticky) {
  .roster-toolbar {
    box-shadow: 0 1px 0 rgba(0, 0, 0, .04);
  }
}

/* 필터/검색/정렬이 바뀌면 카드가 순차적으로 다시 나타납니다 */
@keyframes card-filter-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
.roster-grid.motion .card-shell.is-filtering {
  opacity: 1;
  transform: none;
  animation: card-filter-in .42s cubic-bezier(.2, .8, .2, 1) both;
  animation-delay: calc(var(--i, 0) * 18ms);
}

@media (prefers-reduced-motion: reduce) {
  .roster-grid.motion .card-shell.is-filtering {
    animation: none;
  }
}

/* 정렬: 랜덤일 때 다시 섞기 */
.sort-reshuffle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 26px;
  padding: 0 8px;
  border: 1px solid #dcdfe1;
  background: transparent;
  color: #5b5b64;
  font-size: 11px;
  font-weight: 700;
}
.sort-reshuffle:hover {
  border-color: #111;
  color: #111;
}

/* ────────────────────────────────────────────────────────────
   19. 오늘의 선수 뽑기
   ──────────────────────────────────────────────────────────── */





@media (max-width: 640px) {

   20. photos 폴더 사진 선택

.editor-photo-files > label {

}
.editor-photo-row select {

.editor-photo-row .editor-secondary {

/* ────────────────────────────────────────────────────────────
   21. SITE 헤더 메가 드롭다운 & 사이트 디렉토리 모달 (②+③+④+⑤)
   ──────────────────────────────────────────────────────────── */
.main-nav {
  overflow: visible;
}
.nav-site-wrap {
  position: relative;
  display: flex;
  align-items: stretch;
}
.nav-site-trigger {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 4px;
  border: 0;
  background: transparent;
  color: #999;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .1em;
  position: relative;
}
.nav-site-trigger:hover,
.nav-site-trigger.active {
  color: #fff;
}
.nav-site-trigger.active:after {
  position: absolute;
  content: "";
  height: 3px;
  background: var(--brand-accent, #d61a30);
  bottom: 0;
  left: 0;
  right: 0;
}
.nav-site-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 16px;
  padding: 0 5px;
  background: rgba(214, 26, 48, .22);
  border: 1px solid rgba(214, 26, 48, .55);
  color: #ff6b7b;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .04em;
}
.nav-site-trigger svg {
  transition: transform .2s ease;
}
.nav-site-trigger svg.is-open {
  transform: rotate(180deg);
}

/* 헤더 메가 드롭다운 패널 (②) */
.site-mega-dropdown {
  position: absolute;
  top: calc(100% + 1px);
  left: -24px;

/* ────────────────────────────────────────────────────────────
   22. 헤더 메뉴 슬라이딩 배경 애니메이션 & SITE 카드 글자 넘침 자동 정리
   ──────────────────────────────────────────────────────────── */

/* 헤더 주 메뉴: 마우스를 따라 자연스럽게 이동하는 배경 & 하단 액센트 바 */
.main-nav {
  position: relative;
  align-self: stretch;
  display: flex;
  align-items: stretch;
  gap: 8px;
  margin-left: 72px;
  overflow: visible;
}
.nav-hover-bg {
  position: absolute;
  top: 13px;
  bottom: 13px;
  left: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(214, 26, 48, .18));
  border: 1px solid rgba(255, 255, 255, .12);
  border-bottom: 2px solid var(--brand-accent, #d61a30);
  pointer-events: none;
  z-index: 0;
  transition:
    transform .28s cubic-bezier(.22, 1, .36, 1),
    width .28s cubic-bezier(.22, 1, .36, 1),
    opacity .2s ease;
}
.main-nav > a.nav-item-link,
.main-nav > .nav-site-wrap {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: stretch;
}
.main-nav a.nav-item-link,
.nav-site-trigger {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 16px;
  color: #a8a8b2;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .1em;
  transition: color .2s ease;
  background: transparent;
  border: 0;
}
.main-nav a.nav-item-link:hover,
.main-nav a.nav-item-link.active,
.nav-site-trigger:hover,
.nav-site-trigger.active {
  color: #fff;
}
/* 기존 고정 밑줄(:after) 대신 슬라이딩 배경이 역할을 수행하도록 비활성화 */
.main-nav a.active:after,
.nav-site-trigger.active:after {
  display: none;
}

/* 헤더 우측 버튼 그룹: 마우스를 따라 이동하는 슬라이딩 배경 통일 */
.header-controls {
  position: relative;
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
}
.ctrl-hover-bg {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  background: var(--brand-accent, #d61a30);
  box-shadow: 0 6px 18px rgba(214, 26, 48, .35);
  pointer-events: none;
  z-index: 0;
  transition:
    transform .26s cubic-bezier(.22, 1, .36, 1),
    width .26s cubic-bezier(.22, 1, .36, 1),
    opacity .18s ease;
}
.header-controls .header-edit {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, .03);
  border-color: #3f3f48;
  transition: border-color .2s ease, color .2s ease, background .2s ease;
}
.header-controls .header-edit:hover {
  background: transparent;
  border-color: transparent;
  color: #fff;
}
.header-controls .header-edit.is-active {
  background: var(--brand-accent, #d61a30);
  border-color: var(--brand-accent, #d61a30);
  color: #fff;
}
.header-controls .header-add {
  background: rgba(214, 26, 48, .22);
  border-color: var(--brand-accent, #d61a30);
}
.header-controls .header-add:hover {
  background: transparent;
  border-color: transparent;
  color: #fff;
}

/* ── SITE 드롭다운 & 모달 카드: 긴 제목/도메인/설명이 절대 튀어나오지 않게 자동 정리 ── */
.site-mega-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 14px 0;
}
/* 사이트가 1개나 2개뿐일 때 카드가 지나치게 좁아지지 않도록 자동 폭 배분 */
.site-mega-grid.count-1 {
  grid-template-columns: minmax(0, 1fr);
}
.site-mega-grid.count-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.site-mega-card {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 14px;
  background: #151519;
  border: 1px solid #26262e;
  box-sizing: border-box;
  transition: border-color .18s ease, transform .18s ease, background .18s ease;
}
.site-mega-card-top {
  min-width: 0;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
}
.site-mega-badge {
  flex: none;
  max-width: 45%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.site-mega-roster {
  flex: none;
  white-space: nowrap;
}
.site-mega-domain {
  margin-left: auto;
  min-width: 0;
  flex: 1;
  text-align: right;
  color: #787884;
  font-size: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.site-mega-card-title {
  min-width: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.site-mega-title-text {
  min-width: 0;
  flex: 1;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
}
.site-mega-arrow {
  flex: none;
  font-style: normal;
  color: var(--brand-accent, #d61a30);
  font-size: 11px;
  transition: transform .18s ease;
}
.site-mega-card:hover .site-mega-arrow {
  transform: translate(2px, -2px);
}
.site-mega-desc {
  margin: 0;
  min-width: 0;
  width: 100%;
  font-size: 11px;
  line-height: 1.48;
  color: #9696a2;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

/* 모달 내 사이트 카드도 긴 제목·설명이 튀어나오지 않도록 자동 말줄임 정리 */
.site-card {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.site-card-main {
  min-width: 0;
  width: 100%;
  overflow: hidden;
}
.site-card-main h3 {
  min-width: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.site-card-main h3 > span {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
}
.site-card-arrow {
  flex: none;
}
.site-card-main p {
  min-width: 0;
  width: 100%;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

@media (max-width: 600px) {
  .main-nav {
    margin-left: 0;
    gap: 4px;
    overflow-x: auto;
  }
  .nav-hover-bg {
    top: 4px;
    bottom: 4px;
  }
  .main-nav a.nav-item-link,
  .nav-site-trigger {
    padding: 0 11px;
  }
}


/* ────────────────────────────────────────────────────────────
   23. 히어로 2-A 사선(Diagonal) 교차 필름 스트립 연출
   ──────────────────────────────────────────────────────────── */
.hero.hero-has-strips {
  min-height: 290px;
  isolation: isolate;
}
.hero-film-stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}
.hero-film-plane {
  position: absolute;
  left: -18%;
  right: -18%;
  top: -38%;
  bottom: -38%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  transform: rotate(-12deg) scale(1.06);
  transform-origin: center center;
}
.hero-film-row {
  position: relative;
  display: flex;
  overflow: hidden;
  padding: 5px 0;
  background: rgba(8, 8, 10, .72);
  border-top: 2px dashed rgba(255, 255, 255, .14);
  border-bottom: 2px dashed rgba(255, 255, 255, .14);
  box-shadow: 0 10px 28px rgba(0, 0, 0, .55);
}
.hero-film-track {
  display: flex;
  gap: 10px;
  width: max-content;
  will-change: transform;
  animation: hero-strip-left 46s linear infinite;
}
.hero-film-row.is-reverse .hero-film-track {
  animation-name: hero-strip-right;
  animation-duration: 52s;
}
.hero-film-row.row-3 .hero-film-track {
  animation-duration: 42s;
}
@keyframes hero-strip-left {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-50%, 0, 0); }
}
@keyframes hero-strip-right {
  from { transform: translate3d(-50%, 0, 0); }
  to { transform: translate3d(0, 0, 0); }
}
.hero-film-frame {
  position: relative;
  width: 132px;
  height: 96px;
  flex: 0 0 auto;
  overflow: hidden;
  background: #141418;
  border: 1px solid rgba(255, 255, 255, .12);
}
.hero-film-frame:after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, .05) 40%, rgba(214, 26, 48, .28) 100%);
  mix-blend-mode: multiply;
}
.hero-film-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
  filter: grayscale(65%) contrast(1.12) brightness(.72);
  transform: scale(1.04);
}
.hero-film-caption {
  position: absolute;
  left: 6px;
  right: 6px;
  bottom: 4px;
  z-index: 1;
  font: italic 800 10px/1 "Barlow Condensed", sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .75);
  text-shadow: 0 1px 4px rgba(0, 0, 0, .9);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* 중앙 타이틀 가독성을 높여주는 다중 비네팅 & 스포트라이트 오버레이 */
.hero-film-vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 62% 72% at 50% 50%, rgba(11, 11, 13, .58) 0%, rgba(7, 7, 9, .86) 68%, rgba(5, 5, 7, .96) 100%),
    linear-gradient(180deg, rgba(7, 7, 9, .82) 0%, rgba(11, 11, 13, .28) 48%, rgba(7, 7, 9, .92) 100%),
    radial-gradient(circle at 50% 50%, rgba(214, 26, 48, .18) 0%, transparent 62%);
}
.hero.hero-has-strips .hero-content {
  z-index: 2;
  text-shadow: 0 6px 26px rgba(0, 0, 0, .85);
}
.hero.hero-has-strips h1 {
  text-shadow: 0 8px 32px rgba(0, 0, 0, .92);
}

@media (max-width: 600px) {
  .hero.hero-has-strips {
    min-height: 240px;
  }
  .hero-film-frame {
    width: 104px;
    height: 76px;
  }
  .hero-film-plane {
    gap: 8px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .hero-film-track,
  .hero-film-row.is-reverse .hero-film-track {
    animation: none !important;
  }
}


/* ────────────────────────────────────────────────────────────
   24. 트레이딩 카드 프레임(①) + 실루엣 포스터(②) + 3D 틸트 & 챔피언십 골드(④)
   ──────────────────────────────────────────────────────────── */
.tc-shell {
  --rx: 0deg;
  --ry: 0deg;
  --gx: 50%;
  --gy: 50%;
  perspective: 900px;
}
.tc-shell .tc-frame {
  position: relative;
  display: flex;
  flex-direction: column;
  background: #101014;
  border: 1px solid #26262f;
  padding: 5px 5px 0;
  box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .38);
  transform: rotateX(var(--rx)) rotateY(var(--ry));
  transform-style: preserve-3d;
  transition:
    transform .16s cubic-bezier(.2, .8, .2, 1),
    border-color .24s ease,
    box-shadow .24s ease;
  /* 우측 상단·좌측 하단 살짝 깎인 트레이딩 카드 코너 느낌 */
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.tc-shell:hover .tc-frame {
  border-color: var(--profile-highlight, #d61a30);
  box-shadow:
    0 20px 36px -14px rgba(0, 0, 0, .55),
    0 0 0 1px var(--profile-highlight, #d61a30),
    0 0 22px rgba(214, 26, 48, .28);
}

/* ④ 찜한 선수(★ Favorite): 챔피언십 골드 에디션 프레임 */
.tc-shell.is-champ .tc-frame {
  background: linear-gradient(155deg, #2b2108 0%, #12110e 50%, #291e06 100%);
  border-color: #eab308;
  box-shadow:
    0 12px 28px -12px rgba(234, 179, 8, .38),
    0 0 0 1px rgba(250, 204, 21, .65);
}
.tc-shell.is-champ:hover .tc-frame {
  border-color: #fde047;
  box-shadow:
    0 22px 40px -12px rgba(234, 179, 8, .55),
    0 0 0 2px #facc15,
    0 0 28px rgba(250, 204, 21, .42);
}

/* 카드 이미지 영역 */
.tc-frame .card-image {
  background: #14141a;
  border: 1px solid rgba(255, 255, 255, .08);
}
.tc-shell:hover .card-image {
  box-shadow: none;
}

/* ① 상단 일련번호 & 챔피언 배지 바 */
.tc-top-bar {
  position: absolute;
  top: 7px;
  left: 7px;
  right: 40px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 5px;
  pointer-events: none;
}
.tc-serial {
  padding: 2px 5px;
  background: rgba(8, 8, 12, .72);
  border: 1px solid rgba(255, 255, 255, .14);
  backdrop-filter: blur(4px);
  color: rgba(255, 255, 255, .75);
  font: 800 9.5px/1 "Barlow Condensed", sans-serif;
  letter-spacing: .1em;
}
.tc-champ-tag {
  padding: 2px 6px;
  background: linear-gradient(90deg, #ca8a04, #facc15);
  color: #111;
  font: 900 9px/1 "Barlow Condensed", sans-serif;
  letter-spacing: .08em;
  box-shadow: 0 2px 8px rgba(234, 179, 8, .45);
}

/* 사진 하단 그라데이션 쉐이드 */
.tc-photo-shade {
  position: absolute;
  inset: auto 0 0 0;
  height: 38%;
  background: linear-gradient(180deg, transparent 0%, rgba(10, 10, 14, .75) 100%);
  pointer-events: none;
  z-index: 1;
}

/* ② 사진 없는 선수용 '실루엣 포스터 + 대형 이니셜 워터마크' */
.silhouette-poster {
  position: relative;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(circle at 50% 32%, rgba(214, 26, 48, .26) 0%, transparent 64%),
    linear-gradient(160deg, #1b1b24 0%, #0e0e13 60%, #191016 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  overflow: hidden;
  user-select: none;
}
.tc-shell.is-champ .silhouette-poster {
  background:
    radial-gradient(circle at 50% 32%, rgba(250, 204, 21, .28) 0%, transparent 64%),
    linear-gradient(160deg, #241e12 0%, #0f0e0c 60%, #1f1909 100%);
}
/* 미세한 사선 스트라이프 텍스처 */
.silhouette-bg-glow {
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    -45deg,
    rgba(255, 255, 255, .025) 0px,
    rgba(255, 255, 255, .025) 2px,
    transparent 2px,
    transparent 8px
  );
  pointer-events: none;
}
/* 대형 이니셜 워터마크 */
.silhouette-watermark {
  position: absolute;
  top: 14%;
  left: 50%;
  transform: translateX(-50%) skew(-8deg);
  font: italic 900 clamp(54px, 5.2vw, 78px)/.85 "Barlow Condensed", sans-serif;
  letter-spacing: -.03em;
  color: rgba(255, 255, 255, .07);
  white-space: nowrap;
  pointer-events: none;
  transition: transform .3s ease, color .3s ease;
}
.tc-shell:hover .silhouette-watermark {
  transform: translateX(-50%) skew(-8deg) scale(1.08);
  color: rgba(214, 26, 48, .18);
}
.tc-shell.is-champ:hover .silhouette-watermark {
  color: rgba(250, 204, 21, .22);
}
/* 프로레슬러 실루엣 SVG */
.silhouette-svg {
  position: relative;
  z-index: 1;
  width: 78%;
  height: 76%;
  color: #252530;
  filter: drop-shadow(0 -4px 14px rgba(0, 0, 0, .65));
  transition: transform .3s ease, color .3s ease;
}
.tc-shell:hover .silhouette-svg {
  transform: translateY(-3px) scale(1.03);
  color: #2f2f3d;
}
.silhouette-sub {
  position: absolute;
  bottom: 9px;
  left: 8px;
  right: 8px;
  z-index: 2;
  text-align: center;
  font: 800 9px/1 "Barlow Condensed", sans-serif;
  letter-spacing: .2em;
  color: rgba(255, 255, 255, .36);
}
.silhouette-edit-chip {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: rgba(214, 26, 48, .9);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  box-shadow: 0 6px 16px rgba(0, 0, 0, .45);
}

/* ① 좌측 하단 링크 미니 배지 (YT +2 등) */
.tc-link-badges {
  position: absolute;
  left: 7px;
  bottom: 7px;
  z-index: 3;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  pointer-events: none;
}
.tc-link-pill {
  font-style: normal;
  padding: 2px 6px;
  background: rgba(12, 12, 16, .82);
  border-left: 2px solid var(--brand-accent, #d61a30);
  color: #fff;
  font: 800 9.5px/1.1 "Barlow Condensed", sans-serif;
  letter-spacing: .08em;
}
.tc-shell.is-champ .tc-link-pill {
  border-left-color: #facc15;
}
.tc-link-more {
  padding: 2px 5px;
  background: var(--brand-accent, #d61a30);
  color: #fff;
  font: 800 9px/1.1 "Barlow Condensed", sans-serif;
}

/* ④ 마우스 추적 홀로그램·스포트라이트 광택(Glare) 레이어 */
.tc-holo-glare {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(
      circle 150px at var(--gx, 50%) var(--gy, 50%),
      rgba(255, 255, 255, .28) 0%,
      rgba(214, 26, 48, .12) 45%,
      transparent 75%
    );
  mix-blend-mode: screen;
  transition: opacity .25s ease;
}
.tc-shell.is-champ .tc-holo-glare {
  background:
    radial-gradient(
      circle 160px at var(--gx, 50%) var(--gy, 50%),
      rgba(254, 240, 138, .36) 0%,
      rgba(234, 179, 8, .16) 45%,
      transparent 75%
    );
}
.tc-shell:hover .tc-holo-glare {
  opacity: 1;
}

/* ① 하단 트레이딩 카드 네임플레이트(명패 바) */
.tc-nameplate {
  position: relative;
  width: 100%;
  min-height: 40px;
  padding: 8px 9px 9px;
  background: linear-gradient(180deg, #16161d 0%, #0d0d12 100%);
  border-top: 2px solid #292934;
  color: #f4f4f6 !important;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  text-align: left;
  overflow: hidden;
}
.tc-shell.is-champ .tc-nameplate {
  background: linear-gradient(180deg, #241c08 0%, #120f05 100%);
  border-top-color: #eab308;
  color: #fef08a !important;
}
.tc-name-text {
  min-width: 0;
  flex: 1;
  font-family: "Barlow Condensed", Inter, "Noto Sans KR", sans-serif;
  font-size: clamp(13px, 1.08vw, 15.5px);
  font-weight: 800;
  letter-spacing: .03em;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transform: none !important;
  opacity: 1 !important;
}
.tc-nameplate .card-arrow {
  flex: none;
  font-size: 12px;
  color: var(--brand-accent, #d61a30);
}
.tc-shell.is-champ .tc-nameplate .card-arrow {
  color: #facc15;
}
.tc-nameplate:after {
  bottom: 0;
  height: 2px;
  background: var(--brand-accent, #d61a30);
}
.tc-shell.is-champ .tc-nameplate:after {
  background: #facc15;
}

/* 찜 버튼 위치 미세 조정 */
.tc-shell .favorite-button {
  right: 10px;
  top: 10px;
  width: 28px;
  height: 28px;
  border-radius: 2px;
}
.tc-shell.is-champ .favorite-button.is-favorite {
  background: #facc15;
  color: #111;
  box-shadow: 0 2px 10px rgba(250, 204, 21, .5);
}

@media (hover: none), (prefers-reduced-motion: reduce) {
  .tc-shell .tc-frame {
    transform: none !important;
  }
  .tc-holo-glare {
    display: none;
  }
}


/* ────────────────────────────────────────────────────────────
   25. B-1 다크 아레나 스포트라이트 배경 & 4:5 세로 프로필 모달 & 부드러운 헤더·서브메뉴 모션
   ──────────────────────────────────────────────────────────── */

/* ① B-1 다크 아레나 스포트라이트 (Dark Arena + Red/Blue Overhead Spotlights + Micro Grid) */
.roster-section {
  position: relative;
  isolation: isolate;
  background-color: #0b0b10;
  background-image:
    radial-gradient(ellipse 68% 420px at 50% 0%, rgba(214, 26, 48, .22) 0%, rgba(214, 26, 48, .06) 48%, transparent 80%),
    radial-gradient(circle 560px at 8% 22%, rgba(214, 26, 48, .11) 0%, transparent 72%),
    radial-gradient(circle 620px at 92% 38%, rgba(37, 99, 235, .09) 0%, transparent 72%),
    radial-gradient(circle 580px at 50% 88%, rgba(214, 26, 48, .1) 0%, transparent 75%),
    repeating-linear-gradient(
      -45deg,
      rgba(255, 255, 255, .014) 0px,
      rgba(255, 255, 255, .014) 1px,
      transparent 1px,
      transparent 10px
    );
  border-top: 1px solid rgba(214, 26, 48, .35);
}
/* 상단 히어로와 로스터 경계선에 은은한 네온 레드 스포트라이트 림 광선 */
.roster-section:before {
  content: "";
  position: absolute;
  top: 0;
  left: 10%;
  right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(214, 26, 48, .85), transparent);
  box-shadow: 0 0 24px 2px rgba(214, 26, 48, .55);
  pointer-events: none;
}

/* 다크 아레나 배경 위에서 섹션 제목·툴바·검색·알파벳 필터가 또렷하게 보이도록 글래스모피즘 다크 톤 조율 */
.roster-section .overline {
  color: #ff4d61;
}
.roster-section .section-heading p {
  opacity: .78;
}
.roster-section .roster-toolbar {
  background: rgba(13, 13, 19, .86) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 2px solid rgba(255, 255, 255, .14);
  border-bottom: 1px solid rgba(255, 255, 255, .09);
  padding-left: 14px;
  padding-right: 14px;
}
.roster-section .roster-toolbar.is-stuck {
  box-shadow: 0 16px 32px -12px rgba(0, 0, 0, .78);
}
.roster-section .count {
  background: rgba(214, 26, 48, .2);
  border: 1px solid rgba(214, 26, 48, .45);
  color: #ff6b7b;
}
.roster-section .sort-control {
  border-left-color: rgba(255, 255, 255, .12);
  color: rgba(255, 255, 255, .7);
}
.roster-section .sort-control select {
  color: var(--roster-text, #f4f4f6);
  background: transparent;
}
.roster-section .sort-control select option {
  background: #14141c;
  color: #f4f4f6;
}
.roster-section .sort-reshuffle {
  border-color: rgba(255, 255, 255, .18);
  color: rgba(255, 255, 255, .8);
}
.roster-section .sort-reshuffle:hover {
  border-color: #fff;
  color: #fff;
}
.roster-section .search-box {
  background: rgba(255, 255, 255, .05);
  border: 1px solid rgba(255, 255, 255, .12);
  padding: 5px 10px;
  color: rgba(255, 255, 255, .65);
  transition: border-color .2s ease, background .2s ease;
}
.roster-section .search-box:focus-within {
  border-color: var(--brand-accent, #d61a30);
  background: rgba(255, 255, 255, .08);
}
.roster-section .search-box input {
  color: var(--roster-text, #f4f4f6);
}
.roster-section .search-box input::placeholder {
  color: rgba(255, 255, 255, .42);
}
.roster-section .search-suggestions {
  background: #15151e;
  border-color: #2c2c3a;
  box-shadow: 0 16px 36px rgba(0, 0, 0, .65);
}
.roster-section .search-suggestions button {
  background: transparent;
  color: #f4f4f6;
}
.roster-section .search-suggestions button:hover,
.roster-section .search-suggestions button.selected {
  background: rgba(214, 26, 48, .22);
}
.roster-section .columns-control {
  border-left-color: rgba(255, 255, 255, .12);
}
.roster-section .columns-control strong {
  color: var(--roster-text, #f4f4f6);
}
.roster-section .columns-control button {
  background: rgba(255, 255, 255, .05);
  border-color: rgba(255, 255, 255, .15);
  color: var(--roster-text, #f4f4f6);
}
.roster-section .columns-control button:hover:not(:disabled) {
  background: var(--brand-accent, #d61a30);
  border-color: var(--brand-accent, #d61a30);
  color: #fff;
}
.roster-section .alpha-filter {
  border-top-color: rgba(255, 255, 255, .08);
}
.roster-section .alpha-chip {
  border-color: rgba(255, 255, 255, .14);
  color: rgba(255, 255, 255, .72);
  background: rgba(255, 255, 255, .02);
}
.roster-section .alpha-chip:hover:not(:disabled) {
  border-color: var(--brand-accent, #d61a30);
  color: #fff;
  background: rgba(214, 26, 48, .18);
}
.roster-section .alpha-chip.is-active {
  background: var(--brand-accent, #d61a30);
  border-color: var(--brand-accent, #d61a30);
  color: #fff;
  box-shadow: 0 0 14px rgba(214, 26, 48, .45);
}
.roster-section .add-card {
  background: rgba(255, 255, 255, .03);
  border-color: rgba(255, 255, 255, .18);
  color: rgba(255, 255, 255, .75);
}
.roster-section .add-card > span {
  border-color: rgba(255, 255, 255, .22);
}
.roster-section .add-card:hover {
  background: rgba(214, 26, 48, .12);
  border-color: var(--brand-accent, #d61a30);
  color: #fff;
}
.roster-section .under-grid {
  border-top-color: rgba(255, 255, 255, .1);
}

/* ② 선수 프로필 모달: 가로형(4:3) 대신 로스터 카드와 똑같은 4:5 세로형 프로필 레이아웃 */
.info-modal {
  width: min(650px, 100%);
  max-height: min(90vh, 780px);
}
.info-body.info-body-portrait {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: 24px;
  align-items: start;
  padding: 24px;
}
.info-portrait-col {
  width: 100%;
}
.info-image.info-image-portrait {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: #14141a;
  border: 2px solid #262630;
  box-shadow: 0 14px 32px rgba(0, 0, 0, .35);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
}
.info-image.info-image-portrait.is-champ {
  border-color: #eab308;
  box-shadow: 0 14px 32px rgba(234, 179, 8, .3);
}
.info-image.info-image-portrait img {
  display: block;
  width: auto;
  height: auto;
  min-width: 100%;
  min-height: 100%;
  max-width: none;
  max-height: none;
  object-fit: cover;
}
.info-detail-col {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 100%;
}
.info-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.info-body-portrait .info-copy h3 {
  margin: 0;
  font: italic 900 30px/1 "Barlow Condensed", sans-serif;
  letter-spacing: -.01em;
}
.info-aka {
  margin: 0 0 12px !important;
  min-height: 0 !important;
  font-size: 11.5px !important;
  font-weight: 700;
  color: var(--profile-modal-accent, #d61a30) !important;
}
.info-bio-text {
  margin: 0;
  min-height: 72px;
  font-size: 13px;
  line-height: 1.7;
}
.info-links-block {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid color-mix(in srgb, var(--profile-modal-text, #111) 14%, transparent);
}
.info-links-label {
  display: block;
  margin-bottom: 8px;
  font: 800 10px/1 "Barlow Condensed", sans-serif;
  letter-spacing: .16em;
  color: #888894;
}
.info-body-portrait .info-links {
  margin: 0;
  padding: 0;
  border-top: 0;
}
@media (max-width: 600px) {
  .info-body.info-body-portrait {
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .info-portrait-col {
    max-width: 220px;
    margin: 0 auto;
  }
}

/* ③ 헤더 메인 메뉴 슬라이딩 배경 모션 & 서브메뉴(메가 드롭다운) 부드러운 스프링 애니메이션 */
.nav-hover-bg {
  top: 11px;
  bottom: 11px;
  border-radius: 3px;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(255, 255, 255, .07) 0%, rgba(214, 26, 48, .22) 100%);
  border: 1px solid rgba(255, 255, 255, .1);
  border-bottom: 0;
  box-shadow: 0 6px 20px -6px rgba(214, 26, 48, .45);
  transition:
    transform .36s cubic-bezier(.16, 1, .3, 1),
    width .36s cubic-bezier(.16, 1, .3, 1),
    opacity .22s ease,
    background .25s ease;
  will-change: transform, width, opacity;
}
.nav-hover-bg.is-tracking {
  background: linear-gradient(180deg, rgba(255, 255, 255, .12) 0%, rgba(214, 26, 48, .32) 100%);
  border-color: rgba(214, 26, 48, .45);
}
.nav-hover-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 100%, rgba(214, 26, 48, .55), transparent 70%);
  opacity: .85;
}
.nav-hover-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2.5px;
  background: linear-gradient(90deg, #ff4d61, var(--brand-accent, #d61a30), #ff4d61);
  box-shadow: 0 0 12px var(--brand-accent, #d61a30);
}
.main-nav .nav-item-text {
  display: inline-block;
  transition: transform .26s cubic-bezier(.16, 1, .3, 1), color .2s ease;
}
.main-nav a.nav-item-link:hover .nav-item-text,
.nav-site-trigger:hover .nav-item-text {
  transform: translateY(-1.5px);
}
.ctrl-hover-bg {
  border-radius: 2px;
  transition:
    transform .34s cubic-bezier(.16, 1, .3, 1),
    width .34s cubic-bezier(.16, 1, .3, 1),
    opacity .2s ease;
  will-change: transform, width, opacity;
}

/* 서브메뉴(SITE 메가 드롭다운): 열림/닫힘 양방향 부드러운 3D 스프링 트랜지션 + 내부 카드 순차 등장 */
.site-mega-dropdown {
  position: absolute;
  top: calc(100% + 1px);
  left: -24px;
  z-index: 80;
  width: min(760px, calc(100vw - 32px));
  background: rgba(13, 13, 17, .96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  border: 1px solid #2b2b35;
  border-top: 3px solid var(--brand-accent, #d61a30);
  box-shadow: 0 28px 68px rgba(0, 0, 0, .75);
  padding: 18px 20px 16px;
  transform-origin: 120px top;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translate3d(0, -10px, 0) scale(.965);
  transition:
    opacity .26s cubic-bezier(.16, 1, .3, 1),
    transform .32s cubic-bezier(.16, 1, .3, 1),
    visibility .26s;
  animation: none !important;
  will-change: opacity, transform;
}
.site-mega-dropdown.is-open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate3d(0, 0, 0) scale(1);
}
.site-mega-dropdown .site-mega-card {
  opacity: 0;
  transform: translate3d(0, 10px, 0);
  transition:
    opacity .32s cubic-bezier(.16, 1, .3, 1),
    transform .36s cubic-bezier(.16, 1, .3, 1),
    border-color .18s ease,
    background .18s ease;
  transition-delay: calc(var(--item-idx, 0) * 35ms);
}
.site-mega-dropdown.is-open .site-mega-card {
  opacity: 1;
  transform: translate3d(0, 0, 0);
}
.site-mega-dropdown.is-open .site-mega-card:hover {
  transform: translate3d(0, -3px, 0);
  transition-delay: 0ms;
}


/* ────────────────────────────────────────────────────────────
   26. 카드 찜하기(좌측 상단) · 수정하기(우측 상단) 분리 & 프로필 모달 서브 이름 옆 표시
   ──────────────────────────────────────────────────────────── */

/* 찜하기(♥) 버튼: 왼쪽 상단으로 이동하여 오른쪽 상단 수정(✎) 아이콘과 절대 겹치지 않게 분리 */
.favorite-button,
.tc-shell .favorite-button {
  left: 10px !important;
  right: auto !important;
  top: 10px !important;
  width: 28px;
  height: 28px;
  border-radius: 2px;
  z-index: 4;
}
/* 오른쪽 상단 수정(✎) 배지는 우측 상단 고정 */
.card-edit {
  right: 8px;
  left: auto;
  top: 8px;
  z-index: 3;
}
/* 일련번호(#001)와 ★ MAIN EVENT 배지는 이미지 좌측 하단으로 배치해 상단 양쪽 버튼과 간섭 제로 */
.tc-top-bar {
  top: auto !important;
  bottom: 8px !important;
  left: 8px !important;
  right: 8px !important;
}

/* 프로필 모달: 이름이 2개 이상일 때 첫 번째 이름 바로 옆에 서브 글씨로 나란히 표시 */
.info-header-titles {
  min-width: 0;
  flex: 1;
}
.info-header-name-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 10px;
  margin-top: 4px;
}
.info-header-name-row h2 {
  margin: 0;
}
.info-header-subname {
  font-family: Inter, "Noto Sans KR", sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255, 255, 255, .62);
  letter-spacing: .01em;
}
.info-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 10px;
  margin-bottom: 12px;
}
.info-subname-inline {
  font-family: Inter, "Noto Sans KR", sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  color: color-mix(in srgb, var(--profile-modal-text, #111) 58%, transparent);
  letter-spacing: .01em;
}


/* ────────────────────────────────────────────────────────────
   27. 1400px 그리드 확장 · 테두리 모서리 온전 연결 · 팝업 이미지 크기 최적화 · 메인 배경 커스텀 레이어
   ──────────────────────────────────────────────────────────── */

/* 메인 페이지 로스터 그리드 영역 최대 1400px 확장 */
.section-inner {
  width: min(100% - 64px, 1400px) !important;
  max-width: 1400px !important;
}
.header-inner {
  max-width: 1464px !important;
  padding: 0 32px !important;
}

/* 찜하기(챔피언십 골드) 및 일반 카드 테두리 모서리가 잘리지 않고 끝까지 깔끔하게 이어지도록 clip-path 제거 */
.tc-shell .tc-frame {
  clip-path: none !important;
  border-radius: 4px;
  border-width: 1.5px;
  overflow: hidden;
}
.tc-shell.is-champ .tc-frame {
  border: 2px solid #facc15 !important;
  box-shadow:
    0 12px 28px -12px rgba(234, 179, 8, .42),
    inset 0 0 0 1px rgba(254, 240, 138, .35) !important;
}
.tc-shell.is-champ:hover .tc-frame {
  border: 2px solid #fde047 !important;
  box-shadow:
    0 20px 38px -12px rgba(234, 179, 8, .58),
    0 0 22px rgba(250, 204, 21, .4),
    inset 0 0 0 1px rgba(255, 255, 255, .45) !important;
}

/* 프로필 팝업(모달) 이미지: 과도하게 커지는 현상 해결 & 팝업 크기에 맞게 자동 최적화 */
.info-modal {
  width: min(620px, 100%) !important;
  max-height: min(88vh, 720px) !important;
}
.info-body.info-body-portrait {
  grid-template-columns: 200px minmax(0, 1fr) !important;
  gap: 22px !important;
  align-items: start !important;
}
.info-portrait-col {
  width: 200px !important;
  max-width: 100% !important;
}
.info-image.info-image-portrait {
  clip-path: none !important;
  border-radius: 4px;
  width: 100% !important;
  max-height: 250px !important;
  aspect-ratio: 4 / 5 !important;
  border: 2px solid #282834 !important;
  overflow: hidden !important;
}
.info-image.info-image-portrait.is-champ {
  border: 2px solid #facc15 !important;
}
.info-image.info-image-portrait .info-stage {
  position: relative !important;
  width: 100% !important;
  height: 100% !important;
  min-width: 0 !important;
  min-height: 0 !important;
  overflow: hidden !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  transform-origin: center center !important;
}
.info-image.info-image-portrait .info-stage img,
.info-stage.is-cropped img {
  display: block !important;
  width: auto !important;
  height: auto !important;
  min-width: 100% !important;
  min-height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  object-fit: cover !important;
  object-position: center !important;
}
.info-bio-text {
  min-height: 0 !important;
  margin-top: 4px !important;
}

/* 메인 페이지(로스터 섹션) 커스텀 배경 (그라데이션 / 이미지 업로드 / 어둡게 오버레이) 지원 */
.roster-section.has-custom-bg {
  background-image: var(--roster-bg-layer, none) !important;
  background-size: cover !important;
  background-position: center center !important;
  background-attachment: fixed;
}
.roster-section:after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, var(--roster-overlay, 0));
  pointer-events: none;
  z-index: 0;
}
.roster-section > .section-inner {
  position: relative;
  z-index: 1;
}

@media (max-width: 600px) {
  .section-inner {
    width: calc(100% - 32px) !important;
  }
  .info-body.info-body-portrait {
    grid-template-columns: 1fr !important;
  }
  .info-portrait-col {
    width: 180px !important;
    margin: 0 auto !important;
  }
  .info-image.info-image-portrait {
    max-height: 225px !important;
  }
}


/* ────────────────────────────────────────────────────────────
   28. 히어로 무한 루프 애니메이션 강제 활성화 & 끊김 없는 2-그룹 트랙 구조
   ──────────────────────────────────────────────────────────── */
.hero-film-track {
  display: flex !important;
  gap: 0 !important;
  width: max-content !important;
  will-change: transform;
  animation: none !important;
}
.hero-film-group {
  display: flex;
  gap: 10px;
  padding-right: 10px;
  flex: 0 0 auto;
}


/* ────────────────────────────────────────────────────────────
   29. 프로필 사진 자유 이동(Free Pan & Wheel Zoom & X/Y Sliders) 스타일
   ──────────────────────────────────────────────────────────── */
.crop-box {
  cursor: grab !important;
  border: 1px solid rgba(0, 0, 0, .16);
}
.crop-box.is-dragging {
  cursor: grabbing !important;
}
/* 드래그 중 3x3 구도 안내선 표시 */
.crop-grid-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease;
  background-image:
    linear-gradient(to right, rgba(255, 255, 255, .28) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, .28) 1px, transparent 1px);
  background-size: 33.333% 33.333%;
}
.crop-grid-overlay.is-active {
  opacity: 1;
}
.crop-coords {
  position: absolute;
  left: 8px;
  bottom: 8px;
  padding: 3px 7px;
  background: rgba(0, 0, 0, .72);
  color: #fff;
  font: 700 10px/1.1 "Barlow Condensed", monospace;
  letter-spacing: .06em;
  pointer-events: none;
}
.crop-presets {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}
.crop-preset-btn {
  height: 28px;
  padding: 0 9px;
  border: 1px solid #d4d4dc;
  background: var(--profile-modal-field-bg, #fafafa);
  color: var(--profile-modal-text, #222);
  font-size: 11px;
  font-weight: 700;
  transition: border-color .15s ease, background .15s ease, color .15s ease;
}
.crop-preset-btn:hover {
  border-color: var(--profile-modal-accent, #d61a30);
  color: var(--profile-modal-accent, #d61a30);
}
.crop-snap-toggle {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  color: var(--profile-modal-text, #444);
  cursor: pointer;
}
.crop-snap-toggle input {
  accent-color: var(--profile-modal-accent, #d61a30);
}
.crop-sliders {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 10px 12px;
  background: var(--profile-modal-field-bg, #f7f7fa);
  border: 1px solid rgba(0, 0, 0, .09);
}
.crop-sliders .crop-zoom > span {
  min-width: 74px;
  font-weight: 700;
  color: var(--profile-modal-text, #333);
}
.crop-sliders .crop-zoom input[type="range"] {
  accent-color: var(--profile-modal-accent, #d61a30);
}

/* 카드와 프로필 팝업에서도 사진 이동 시 빈 여백이 생기면 블러 배경(.card-fill)이 자연스럽게 채워주도록 상시 렌더링 */
.card-image.has-photo .card-fill,
.info-image.info-image-portrait .card-fill {
  display: block;
}

/* ────────────────────────────────────────────────────────────

  filter: brightness(1.03) !important;
