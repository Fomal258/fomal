/* 이미지 위를 덮던 불필요한 레이어 완전 비활성화 */
.tc-shell .tc-holo-glare,
.tc-shell.is-champ .tc-holo-glare,
.tc-shell:hover .tc-holo-glare,
.tc-shell .card-image::before,
.tc-shell.is-champ .card-image::before,
.tc-shell .tc-frame::after {
  display: none !important;
  content: none !important;
  opacity: 0 !important;
}

/* ② 평소(일반) 프로필 테두리: 고급스러운 플래티넘 실버 크롬(Silver Chrome) 다이컷 베젤 (마우스 추적 빛 없음) */
.tc-shell .tc-frame,
.tc-shell:hover .tc-frame {
  position: relative !important;
  padding: 3.5px !important;
  border: 0 !important;
  border-radius: 0 !important;
  transform: none !important;
  background: linear-gradient(
    135deg,
    #646c7a 0%,
    #e2e8f0 22%,
    #94a0b2 44%,
    #ffffff 50%,
    #788292 58%,
    #d8e0ea 82%,
    #58606e 100%
  ) !important;
  clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px) !important;
  box-shadow:
    0 14px 30px rgba(0, 0, 0, .72),
    0 0 10px rgba(203, 213, 225, .14) !important;
  transition: box-shadow .28s ease, filter .28s ease !important;
}
.tc-shell:not(.is-champ):hover .tc-frame {
  box-shadow:
    0 18px 36px rgba(0, 0, 0, .82),
    0 0 18px rgba(226, 232, 240, .28) !important;
}

/* ③ 찜한(챔피언) 프로필 테두리: 깊고 중후한 24K 샴페인·앤틱 럭셔리 골드 크롬 + 마우스 추적 스페큘러 광택 */
.tc-shell.is-champ .tc-frame {
  transform: none !important;
  background:
    radial-gradient(
      165px circle at var(--gx, 50%) var(--gy, 50%),
      rgba(255, 253, 240, .98) 0%,
      rgba(247, 218, 132, .92) 30%,
      rgba(198, 146, 46, .48) 60%,
      transparent 100%
    ),
    linear-gradient(
      135deg,
      #63450e 0%,
      #e6c670 22%,
      #9a6d1c 44%,
      #fff6d1 51%,
      #a67720 58%,
      #ebd082 80%,
      #593d0b 100%
    ) !important;
  box-shadow:
    0 15px 34px rgba(0, 0, 0, .8),
    0 0 18px rgba(226, 184, 78, .32) !important;
}
.tc-shell.is-champ:hover .tc-frame {
  transform: none !important;
  background:
    radial-gradient(
      195px circle at var(--gx, 50%) var(--gy, 50%),
      #ffffff 0%,
      #fff8db 26%,
      #f0cb69 52%,
      rgba(196, 144, 42, .42) 78%,
      transparent 100%
    ),
    linear-gradient(
      135deg,
      #63450e 0%,
      #e6c670 22%,
      #9a6d1c 44%,
      #fff6d1 51%,
      #a67720 58%,
      #ebd082 80%,
      #593d0b 100%
    ) !important;
  box-shadow:
    0 20px 40px rgba(0, 0, 0, .88),
    0 0 28px rgba(240, 198, 96, .52) !important;
}

/* ④ 내부 이미지 영역 & 하단 가독성 쉐이드 */
.tc-shell .card-image-button,
.tc-shell .card-image-link {
  display: block !important;
  width: 100% !important;
  padding: 0 !important;
  margin: 0 !important;
  border: 0 !important;
  background: transparent !important;
}
.tc-shell .card-image,
.tc-shell:hover .card-image {
  position: relative !important;
  width: 100% !important;
  aspect-ratio: 5 / 7 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  box-shadow: none !important;
  background: #09090d !important;
  border-radius: 0 !important;
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px) !important;
  overflow: hidden !important;
}
.tc-shell .card-image::after {
  content: "" !important;
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 2 !important;
  pointer-events: none !important;
  box-shadow: none !important;
  background: linear-gradient(
    to bottom,
    rgba(6, 6, 9, 0) 46%,
    rgba(6, 6, 9, .68) 76%,
    rgba(4, 4, 7, .97) 100%
  ) !important;
}

/* ⑤ 고휘도·고가독성 대형 메탈릭 이름 (어두운 중간 띠 완전 제거 + 글자 크기 대폭 확대 + 칼같은 입체 베벨) */
.tc-shell .card-caption.tc-nameplate,
.tc-shell .card-caption.tc-nameplate:hover {
  position: absolute !important;
  left: 5px !important;
  right: 5px !important;
  bottom: 10px !important;
  z-index: 9 !important;
  padding: 0 2px !important;
  border: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  text-align: center !important;
  pointer-events: auto !important;
  overflow: visible !important;
  color: inherit !important;
}

/* 평소 프로필: 어두운 회색 음영 없이 눈부시게 밝은 플래티넘 실버 메탈릭 + 칼같은 3D 다크 베벨 */
.tc-shell .tc-name-text {
  display: block !important;
  width: 100% !important;
  font-family: "Barlow Condensed", "Oswald", "Noto Sans KR", sans-serif !important;
  font-style: italic !important;
  font-weight: 900 !important;
  /* 기본 글자 크기를 대폭 키워 한눈에 시원하게 들어오게 설정 */
  font-size: clamp(23px, 2.05vw, 31px) !important;
  line-height: 1.05 !important;
  letter-spacing: .025em !important;
  text-transform: uppercase !important;
  white-space: nowrap !important;
  overflow: visible !important;
  text-overflow: clip !important;
  max-height: none !important;
  padding-bottom: 2px !important;
  /* 어두운 중간띠를 완전히 없애고 밝은 순백~밝은 실버 톤으로만 구성된 고휘도 실버 그라데이션 */
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #f8fafc 38%,
    #cbd5e1 68%,
    #f1f5f9 100%
  ) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: transparent !important;
  -webkit-text-fill-color: transparent !important;
  text-shadow: none !important;
  /* 먹물처럼 번지던 다중 블러를 빼고, 또렷한 1px·2px 솔리드 3D 입체 엣지 + 하단 그림자만 적용 */
  filter:
    drop-shadow(0 1px 0 #090a0f)
    drop-shadow(0 2.5px 0 #000000)
    drop-shadow(0 4px 7px rgba(0, 0, 0, .92)) !important;
  transition: transform .24s ease, filter .24s ease !important;
}

/* 중간 길이 이름(15~20자, 예: ALEXANDER GREY, CHANNING DECKER)도 큼직하게 한 줄 유지 */
.tc-shell .tc-name-text.is-long {
  font-size: clamp(19.5px, 1.68vw, 25px) !important;
  letter-spacing: .015em !important;
}
/* 아주 긴 이름(21자 이상)도 잘리지 않고 선명하게 한 줄 유지 */
.tc-shell .tc-name-text.is-xlong {
  font-size: clamp(15.5px, 1.32vw, 20px) !important;
  letter-spacing: 0em !important;
}

/* 카드나 이름에 마우스를 올렸을 때 어두워지지 않고 오히려 더 밝고 선명하게 빛남! */
.tc-shell:hover .tc-name-text,
.tc-shell .card-caption.tc-nameplate:hover .tc-name-text {
  transform: translateY(-2px) scale(1.02) !important;
  filter:
    brightness(1.1)
    drop-shadow(0 1px 0 #090a0f)
    drop-shadow(0 2.5px 0 #000000)
    drop-shadow(0 5px 10px rgba(0, 0, 0, .96)) !important;
}

/* 찜한(챔피언) 프로필 이름: 어두운 갈색을 완전히 뺀 고휘도 24K 샴페인·선샤인 골드 메탈릭 */
.tc-shell.is-champ .tc-name-text {
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #fff9db 28%,
    #fde047 64%,
    #f59e0b 90%,
    #fef08a 100%
  ) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: transparent !important;
  -webkit-text-fill-color: transparent !important;
  filter:
    drop-shadow(0 1px 0 #1c1102)
    drop-shadow(0 2.5px 0 #000000)
    drop-shadow(0 4px 8px rgba(0, 0, 0, .95))
    drop-shadow(0 0 8px rgba(250, 204, 21, .28)) !important;
}
.tc-shell.is-champ:hover .tc-name-text,
.tc-shell.is-champ .card-caption.tc-nameplate:hover .tc-name-text {
  transform: translateY(-2px) scale(1.02) !important;
  filter:
    brightness(1.12)
    drop-shadow(0 1px 0 #1c1102)
    drop-shadow(0 2.5px 0 #000000)
    drop-shadow(0 5px 10px rgba(0, 0, 0, .98))
    drop-shadow(0 0 12px rgba(253, 224, 71, .45)) !important;
}

@media (max-width: 640px) {
  .tc-shell .tc-name-text {
    font-size: 19px !important;
  }
  .tc-shell .tc-name-text.is-long {
    font-size: 16px !important;
  }
  .tc-shell .tc-name-text.is-xlong {
    font-size: 13.5px !important;
  }
}

/* ⑥ 찜(챔피언 벨트) 버튼: ON/OFF 모두 배경 완전 제거 + 미선택 시 아이콘 근처로 마우스 호버할 때만 OFF 실버 벨트 표시 */
.tc-shell .favorite-button,
.tc-shell:hover .favorite-button,
.tc-shell.is-champ .favorite-button.is-favorite,
.tc-shell .favorite-button:hover,
.tc-shell .favorite-button.is-favorite {
  left: 6px !important;
  right: auto !important;
  top: 6px !important;
  width: 58px !important;
  height: 44px !important;
  padding: 6px 0 0 7px !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  display: flex !important;
  align-items: flex-start !important;
  justify-content: flex-start !important;
  z-index: 14 !important;
}
.tc-shell .favorite-button:not(.is-favorite),
.tc-shell:hover .favorite-button:not(.is-favorite) {
  opacity: 0 !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(.94);
  transition: opacity .2s ease, transform .22s ease !important;
}
.tc-shell .favorite-button:not(.is-favorite):hover,
.tc-shell .favorite-button:not(.is-favorite):focus-visible {
  opacity: 1 !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(1.06) !important;
}
.tc-shell .favorite-button.is-favorite,
.tc-shell:hover .favorite-button.is-favorite,
.tc-shell.is-champ .favorite-button.is-favorite {
  opacity: 1 !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(1);
}
.tc-shell .favorite-button.is-favorite:hover,
.tc-shell.is-champ .favorite-button.is-favorite:hover {
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(1.12) !important;
}
.tc-shell .favorite-button svg.champ-belt-svg {
  width: 42px !important;
  height: 28px !important;
  display: block !important;
  background: transparent !important;
  filter:
    drop-shadow(0 1.5px 2px rgba(0, 0, 0, .95))
    drop-shadow(0 0 2px rgba(0, 0, 0, .85)) !important;
}
.tc-shell .favorite-button.is-favorite svg.champ-belt-svg {
  width: 44px !important;
  height: 30px !important;
  background: transparent !important;
  filter:
    drop-shadow(0 2px 3px rgba(0, 0, 0, .98))
    drop-shadow(0 0 8px rgba(226, 184, 78, .55)) !important;
}


/* ────────────────────────────────────────────────────────────
   33. 찜한 선수 & 마우스 호버 시 이름 어두워짐(다크 틴트/그림자) 완전 제거 · 초고휘도 고정
   ──────────────────────────────────────────────────────────── */
.tc-shell .card-caption.tc-nameplate,
.tc-shell:hover .card-caption.tc-nameplate,
.tc-shell.is-champ .card-caption.tc-nameplate,
.tc-shell.is-champ:hover .card-caption.tc-nameplate,
.tc-shell .card-caption.tc-nameplate:hover,
.tc-shell .card-caption.tc-nameplate:focus,
.tc-shell .card-caption.tc-nameplate:active {
  background: transparent !important;
  box-shadow: none !important;
  text-shadow: none !important;
  filter: none !important;
  opacity: 1 !important;
}

/* 일반 선수 이름 (평소 & 호버 모두 어두운 회색 없이 쨍하고 밝은 화이트·실버 고정) */
.tc-shell:not(.is-champ) .tc-name-text,
.tc-shell:not(.is-champ):hover .tc-name-text,
.tc-shell:not(.is-champ) .card-caption.tc-nameplate:hover .tc-name-text {
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #ffffff 55%,
    #e2e8f0 100%
  ) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: #ffffff !important;
  -webkit-text-fill-color: transparent !important;
  text-shadow: none !important;
  opacity: 1 !important;
  filter:
    drop-shadow(0 1.5px 0 #000000)
    drop-shadow(0 3px 5px rgba(0, 0, 0, .85)) !important;
}

/* 찜한(챔피언) 선수 이름 (평소 & 호버 모두 어두운 갈색·주황색을 완전히 뺀 밝은 순금·화이트 골드 고정) */
.tc-shell.is-champ .tc-name-text,
.tc-shell.is-champ:hover .tc-name-text,
.tc-shell.is-champ .card-caption.tc-nameplate:hover .tc-name-text {
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #fffef0 45%,
    #fde047 100%
  ) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: #fef08a !important;
  -webkit-text-fill-color: transparent !important;
  text-shadow: none !important;
  opacity: 1 !important;
  filter:
    drop-shadow(0 1.5px 0 #000000)
    drop-shadow(0 3px 5px rgba(0, 0, 0, .85)) !important;
}

/* ────────────────────────────────────────────────────────────
   34. 깃허브 실시간 자동 저장(GitHub Direct Auto-Sync) 버튼 & 설정 모달
   ──────────────────────────────────────────────────────────── */
.header-gh-sync {
  position: relative;
  gap: 6px !important;
}
.gh-sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #71717a;
  display: inline-block;
  flex: none;
}
.gh-sync-dot.is-synced {
  background: #22c55e;
  box-shadow: 0 0 8px rgba(34, 197, 94, .85);
}
.gh-sync-dot.is-syncing {
  background: #eab308;
  box-shadow: 0 0 8px rgba(234, 179, 8, .9);
  animation: ghPulse 1s infinite alternate;
}
.gh-sync-dot.is-error {
  background: #ef4444;
  box-shadow: 0 0 8px rgba(239, 68, 68, .9);
}
@keyframes ghPulse {
  from { transform: scale(.85); opacity: .65; }
  to { transform: scale(1.2); opacity: 1; }
}
.gh-sync-modal {
  width: min(580px, 100%) !important;
}
.gh-sync-guide {
  background: rgba(24, 24, 32, .06);
  border: 1px solid rgba(0, 0, 0, .12);
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 12px;
  line-height: 1.55;
  color: var(--profile-modal-text, #222);
}
.gh-sync-guide strong {
  display: block;
  margin-bottom: 6px;
  color: var(--profile-modal-accent, #d61a30);
  font-size: 12.5px;
}
.gh-sync-guide ol {
  margin: 0;
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.gh-sync-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 540px) {
  .gh-sync-grid {
    grid-template-columns: 1fr;
  }
}
.gh-sync-check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--profile-modal-text, #111);
  cursor: pointer;
}
.gh-sync-check input {
  width: 16px;
  height: 16px;
  accent-color: var(--profile-modal-accent, #d61a30);
}
.gh-sync-feedback {
  margin-top: 10px;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.45;
  background: #f4f4f6;
  border-left: 3px solid #71717a;
  color: #18181b;
}
.gh-sync-feedback.is-synced {
  background: #ecfdf5;
  border-left-color: #10b981;
  color: #065f46;
}
.gh-sync-feedback.is-error {
  background: #fef2f2;
  border-left-color: #ef4444;
  color: #991b1b;
}

/* ────────────────────────────────────────────────────────────
   35. UNSLOP REDLINE PASS & MOBILE OPTIMIZATION
   · 헤더 / 메인메뉴 / 편집메뉴 1:1 호버 영역 정렬 및 높이(36px)·간격(8px) 통일
   · 보라빛 다크 그라데이션 및 과도한 네온 글로우(AI Slop) 제거 → 매트 카본 다크(#09090b)
   · 모바일·태블릿 완벽 반응형 레이아웃 및 터치 스크롤 최적화
   ──────────────────────────────────────────────────────────── */

/* CSS zoom으로 인한 좌표 왜곡 방지 */
.site-shell {
  zoom: 1 !important;
}

/* 헤더 바 정밀 정렬 */
.site-header {
  height: 64px !important;
  background: #09090b !important;
  border-bottom: 1px solid #1f1f23 !important;
}
.header-inner {
  max-width: 1464px !important;
  height: 100% !important;
  margin: 0 auto !important;
  padding: 0 32px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: flex-start !important;
  gap: 20px !important;
  flex-wrap: nowrap !important;
}

/* 위치 어긋남을 유발하던 부유형 슬라이딩 캡슐 비활성화 (각 버튼에 1:1 직접 호버 적용) */
.nav-hover-bg,
.ctrl-hover-bg {
  display: none !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

/* 메인 메뉴 & 우측 편집 메뉴 컨테이너 정렬 통일 */
.main-nav {
  position: relative !important;
  align-self: center !important;
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  margin: 0 0 0 16px !important;
  padding: 0 !important;
  flex: 0 0 auto !important;
  overflow: visible !important;
}
.main-nav > a.nav-item-link,
.main-nav > .nav-site-wrap {
  position: relative !important;
  display: inline-flex !important;
  align-items: center !important;
  height: 36px !important;
  margin: 0 !important;
}
.header-controls {
  position: relative !important;
  margin-left: auto !important;
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  flex: 0 0 auto !important;
}

/* 헤더 내 모든 메뉴 링크 및 편집 버튼 규격 1:1 완전 통일 (높이 36px, 패딩 0 14px, 곡률 6px) */
.main-nav a.nav-item-link,
.main-nav .nav-site-trigger,
.header-controls .header-edit {
  box-sizing: border-box !important;
  height: 36px !important;
  padding: 0 14px !important;
  margin: 0 !important;
  border-radius: 6px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;
  font-family: Inter, "Noto Sans KR", sans-serif !important;
  font-size: 12px !important;
  font-weight: 700 !important;
  line-height: 1 !important;
  letter-spacing: 0.02em !important;
  white-space: nowrap !important;
  color: #d4d4d8 !important;
  background: #121215 !important;
  border: 1px solid #27272a !important;
  box-shadow: none !important;
  transform: none !important;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease !important;
}
.main-nav .nav-item-text {
  transform: none !important;
  line-height: 1 !important;
}
.main-nav a.active:after,
.nav-site-trigger.active:after {
  display: none !important;
}

/* 호버 시 글자·박스 영역과 1px 오차 없이 일치하는 하이라이트 */
.main-nav a.nav-item-link:hover,
.main-nav .nav-site-trigger:hover,
.header-controls .header-edit:hover:not(:disabled) {
  background: #27272a !important;
  color: #ffffff !important;
  border-color: #52525b !important;
  transform: none !important;
}

/* 활성 탭 & 활성 편집 버튼 포인트 (절제된 크림슨 보더/배경) */
.main-nav a.nav-item-link.active,
.main-nav .nav-site-trigger.active {
  background: #18181b !important;
  color: #ffffff !important;
  border-color: var(--brand-accent, #d61a30) !important;
}
.header-controls .header-edit.is-active,
.header-controls .header-add {
  background: var(--brand-accent, #d61a30) !important;
  color: #ffffff !important;
  border-color: var(--brand-accent, #d61a30) !important;
}
.header-controls .header-edit.is-active:hover:not(:disabled),
.header-controls .header-add:hover:not(:disabled) {
  background: #b91528 !important;
  border-color: #ff4d61 !important;
  color: #ffffff !important;
}

/* SITE 드롭다운 내부 버튼들도 1:1 호버 영역 일치 */
.site-mega-dropdown {
  top: calc(100% + 8px) !important;
  left: 0 !important;
  border-radius: 8px !important;
  border: 1px solid #27272a !important;
  border-top: 2px solid var(--brand-accent, #d61a30) !important;
  background: #0d0d10 !important;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.85) !important;
}
.site-mega-add,
.site-mega-all,
.site-mega-cats button,
.site-mega-manage {
  box-sizing: border-box !important;
  height: 32px !important;
  padding: 0 12px !important;
  border-radius: 6px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;
  line-height: 1 !important;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease !important;
}

/* 배경의 보라색/원색 네온 스포트라이트(AI Slop) 제거 → 매트 카본 다크 스튜디오 */
.roster-section,
.roster-section.has-custom-bg {
  background-color: #09090b !important;
  background-image: none !important;
  border-top: 1px solid #18181b !important;
}
.roster-section:before {
  display: none !important;
}
.roster-section .roster-toolbar {
  background: #121215 !important;
  border: 1px solid #27272a !important;
  border-radius: 8px !important;
  padding: 8px 16px !important;
  min-height: 54px !important;
}
.roster-section .alpha-chip {
  border-radius: 4px !important;
  box-shadow: none !important;
}
.roster-section .alpha-chip.is-active {
  box-shadow: none !important;
}

/* 상태 표시점(Dot) 번지는 네온 글로우 제거 */
.gh-sync-dot {
  width: 7px !important;
  height: 7px !important;
  box-shadow: none !important;
  animation: none !important;
}

/* 모바일 및 태블릿 완벽 반응형 최적화 */
@media (max-width: 960px) {
  .site-header {
    height: auto !important;
    min-height: 58px !important;
    padding: 8px 0 !important;
  }
  .header-inner {
    padding: 0 16px !important;
    overflow-x: auto !important;
    gap: 10px !important;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .header-inner::-webkit-scrollbar {
    display: none;
  }
  .main-nav {
    margin-left: 8px !important;
    gap: 6px !important;
  }
  .header-controls {
    gap: 6px !important;
  }
  .header-controls .header-edit span {
    display: inline !important;
  }
  .main-nav a.nav-item-link,
  .main-nav .nav-site-trigger,
  .header-controls .header-edit {
    height: 34px !important;
    padding: 0 11px !important;
    font-size: 11.5px !important;
  }
  .site-mega-dropdown {
    position: fixed !important;
    top: 60px !important;
    left: 12px !important;
    right: 12px !important;
    width: auto !important;
    max-height: calc(100vh - 80px) !important;
    overflow-y: auto !important;
  }
}

@media (max-width: 640px) {
  .section-inner {
    width: calc(100% - 24px) !important;
  }
  .roster-section {
    padding: 32px 0 56px !important;
  }
  .roster-section .roster-toolbar {
    padding: 10px 12px !important;
    gap: 10px !important;
  }
  .toolbar-right {
    width: 100% !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
    justify-content: space-between !important;
  }
  .search-box {
    flex: 1 1 100% !important;
    width: 100% !important;
  }
  .search-box input {
    width: 100% !important;
  }
  .alpha-filter {
    display: flex !important;
    flex-wrap: nowrap !important;
    overflow-x: auto !important;
    gap: 4px !important;
    padding-bottom: 6px !important;
    -webkit-overflow-scrolling: touch;
  }
  .alpha-chip {
    flex: 0 0 auto !important;
    min-width: 30px !important;
    height: 30px !important;
  }
  .roster-grid {
    column-gap: 10px !important;
    row-gap: 16px !important;
  }
  .editor-modal,
  .gh-sync-modal,
  .info-modal {
    width: min(94vw, 520px) !important;
    max-height: 88vh !important;
  }
}

    
/* 사진 크롭 영역 위에서 마우스 휠·터치 사용 시 모달 스크롤 전파 차단 */
.crop-box {
  overscroll-behavior: contain !important;
  touch-action: none !important;
}


/* ────────────────────────────────────────────────────────────
   36. 유망주(PROSPECT) 01번 클래식 타임키퍼 타종 벨 & 플래티넘 코발트 테마 (Option 3)
   ──────────────────────────────────────────────────────────── */
.tc-shell .prospect-button,
.tc-shell:hover .prospect-button,
.tc-shell.is-prospect .prospect-button.is-prospect,
.tc-shell .prospect-button:hover,
.tc-shell .prospect-button.is-prospect {
  position: absolute !important;
  left: 6px !important;
  right: auto !important;
  top: 40px !important;
  width: 58px !important;
  height: 44px !important;
  padding: 4px 0 0 7px !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  display: flex !important;
  align-items: flex-start !important;
  justify-content: flex-start !important;
  z-index: 14 !important;
  cursor: pointer !important;
}
.tc-shell .prospect-button:not(.is-prospect),
.tc-shell:hover .prospect-button:not(.is-prospect) {
  opacity: 0 !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(.94);
  transition: opacity .2s ease, transform .22s ease !important;
}
.tc-shell .prospect-button:not(.is-prospect):hover,
.tc-shell .prospect-button:not(.is-prospect):focus-visible {
  opacity: 1 !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(1.06) !important;
}
.tc-shell .prospect-button.is-prospect,
.tc-shell:hover .prospect-button.is-prospect,
.tc-shell.is-prospect .prospect-button.is-prospect {
  opacity: 1 !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(1);
}
.tc-shell .prospect-button.is-prospect:hover,
.tc-shell.is-prospect .prospect-button.is-prospect:hover {
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  transform: scale(1.12) !important;
}
.tc-shell .prospect-button svg.prospect-bell-svg {
  width: 42px !important;
  height: 28px !important;
  display: block !important;
  background: transparent !important;
  filter:
    drop-shadow(0 1.5px 2px rgba(0, 0, 0, .95))
    drop-shadow(0 0 2px rgba(0, 0, 0, .85)) !important;
}
.tc-shell .prospect-button.is-prospect svg.prospect-bell-svg {
  width: 44px !important;
  height: 30px !important;
  background: transparent !important;
  filter:
    drop-shadow(0 2px 3px rgba(0, 0, 0, .98))
    drop-shadow(0 0 9px rgba(59, 130, 246, .65)) !important;
}

/* 유망주 단독 ON: 플래티넘 코발트 크롬 카드 프레임 & 마우스 추적 스페큘러 광택 */
.tc-shell.is-prospect:not(.is-champ) .tc-frame {
  transform: none !important;
  background:
    radial-gradient(
      165px circle at var(--gx, 50%) var(--gy, 50%),
      rgba(240, 249, 255, .98) 0%,
      rgba(147, 197, 253, .92) 30%,
      rgba(37, 99, 235, .52) 60%,
      transparent 100%
    ),
    linear-gradient(
      135deg,
      #0f2952 0%,
      #93c5fd 22%,
      #1d4ed8 44%,
      #ffffff 51%,
      #2563eb 58%,
      #bae6fd 80%,
      #0f172a 100%
    ) !important;
  box-shadow:
    0 15px 34px rgba(0, 0, 0, .82),
    0 0 18px rgba(59, 130, 246, .36) !important;
}
.tc-shell.is-prospect:not(.is-champ):hover .tc-frame {
  transform: none !important;
  background:
    radial-gradient(
      195px circle at var(--gx, 50%) var(--gy, 50%),
      #ffffff 0%,
      #e0f2fe 26%,
      #60a5fa 52%,
      rgba(29, 78, 216, .45) 78%,
      transparent 100%
    ),
    linear-gradient(
      135deg,
      #0f2952 0%,
      #93c5fd 22%,
      #1d4ed8 44%,
      #ffffff 51%,
      #2563eb 58%,
      #bae6fd 80%,
      #0f172a 100%
    ) !important;
  box-shadow:
    0 20px 40px rgba(0, 0, 0, .88),
    0 0 28px rgba(96, 165, 250, .55) !important;
}

/* 유망주 단독 ON: 고휘도 플래티넘 코발트 메탈릭 이름 */
.tc-shell.is-prospect:not(.is-champ) .tc-name-text,
.tc-shell.is-prospect:not(.is-champ):hover .tc-name-text,
.tc-shell.is-prospect:not(.is-champ) .card-caption.tc-nameplate:hover .tc-name-text {
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #e0f2fe 45%,
    #60a5fa 100%
  ) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: #bae6fd !important;
  -webkit-text-fill-color: transparent !important;
  text-shadow: none !important;
  opacity: 1 !important;
  filter:
    drop-shadow(0 1.5px 0 #020617)
    drop-shadow(0 3px 5px rgba(0, 0, 0, .88)) !important;
}

/* 찜(24K 골드) + 유망주(플래티넘 코발트) 동시 ON: 듀얼 하이브리드 크롬 프레임 */
.tc-shell.is-champ.is-prospect .tc-frame,
.tc-shell.is-champ.is-prospect:hover .tc-frame {
  transform: none !important;
  background:
    radial-gradient(
      180px circle at var(--gx, 50%) var(--gy, 50%),
      #ffffff 0%,
      rgba(254, 240, 138, .85) 32%,
      rgba(96, 165, 250, .65) 64%,
      transparent 100%
    ),
    linear-gradient(
      135deg,
      #63450e 0%,
      #facc15 24%,
      #fffbeb 46%,
      #ffffff 50%,
      #60a5fa 56%,
      #1d4ed8 78%,
      #0f172a 100%
    ) !important;
  box-shadow:
    0 18px 38px rgba(0, 0, 0, .86),
    -4px -4px 18px rgba(250, 204, 21, .34),
    4px 4px 18px rgba(59, 130, 246, .4) !important;
}

/* 프로필 상세 모달 내 유망주 배지 & 프레임 */
.tc-prospect-tag {
  padding: 2px 6px;
  background: linear-gradient(90deg, #1d4ed8, #60a5fa);
  color: #ffffff;
  font: 900 9px/1 "Barlow Condensed", sans-serif;
  letter-spacing: .08em;
  box-shadow: 0 2px 8px rgba(37, 99, 235, .45);
}
.info-image.info-image-portrait.is-prospect:not(.is-champ) {
  border: 2px solid #60a5fa !important;
  box-shadow: 0 14px 32px rgba(37, 99, 235, .3) !important;
}
